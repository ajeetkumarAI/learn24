<script>window.LESSON = {
 "eyebrow": "Agentic AI · Protocols",
 "title": "MCP in 5 Minutes",
 "color": "#45d19b",
 "lede": "The Model Context Protocol is a standard way to plug tools and data into any AI app, like USB-C for AI integrations.",
 "steps": [
  {
   "t": "The problem: N × M integrations",
   "s": "Every AI app built its own connector for every tool.",
   "b": [
    {
     "type": "table",
     "head": [
      "",
      "Without MCP",
      "With MCP"
     ],
     "rows": [
      [
       "3 apps × 5 tools",
       "15 custom connectors",
       "3 clients + 5 servers"
      ],
      [
       "New tool",
       "update every app",
       "write one server"
      ],
      [
       "New app",
       "rebuild every connector",
       "speak MCP once"
      ]
     ]
    }
   ]
  },
  {
   "t": "The three roles",
   "s": "A host app runs MCP clients; each client connects to one MCP server.",
   "b": [
    {
     "type": "flow",
     "nodes": [
      [
       "Host",
       "Claude, IDE, your app"
      ],
      [
       "MCP client",
       "one per server"
      ],
      [
       "MCP server",
       "wraps a tool or data"
      ],
      [
       "Real system",
       "GitHub, DB, Drive"
      ]
     ],
     "hot": [
      2
     ]
    }
   ]
  },
  {
   "t": "What a server can offer",
   "s": "Three building blocks.",
   "b": [
    {
     "type": "cards",
     "items": [
      [
       "Tools",
       "actions the model can call",
       "create_ticket(title, priority)"
      ],
      [
       "Resources",
       "data the app can read",
       "file://policies/fd.pdf"
      ],
      [
       "Prompts",
       "reusable templates",
       "/summarise-ticket"
      ]
     ]
    }
   ]
  },
  {
   "t": "How they talk",
   "s": "JSON-RPC 2.0 messages over stdio (local) or Streamable HTTP (remote).",
   "b": [
    {
     "type": "code",
     "cap": "client → server",
     "text": "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\", …}\n{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}\n{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\n \"params\":{\"name\":\"create_ticket\",\"arguments\":{\"title\":\"Card blocked\",\"priority\":\"high\"}}}"
    }
   ]
  },
  {
   "t": "Connect a server",
   "s": "Most hosts take a small config entry.",
   "b": [
    {
     "type": "code",
     "cap": "host config",
     "text": "{\n  \"mcpServers\": {\n    \"tickets\": { \"command\": \"python\", \"args\": [\"tickets_server.py\"] }\n  }\n}"
    }
   ]
  },
  {
   "t": "Use it safely",
   "s": "An MCP server is code you are trusting with your data.",
   "b": [
    {
     "type": "list",
     "items": [
      [
       "Install from trusted publishers only",
       "look-alike servers exist (OWASP ASI04)"
      ],
      [
       "Pin versions and review tool descriptions",
       "descriptions can hide instructions"
      ],
      [
       "Give servers least privilege",
       "scoped tokens, read-only where possible"
      ],
      [
       "Ask before risky tool calls",
       "human approval for writes and sends"
      ]
     ]
    }
   ]
  }
 ],
 "takeaways": [
  [
   "MCP standardises tools, resources and prompts",
   "one protocol, many apps"
  ],
  [
   "Host → client → server",
   "each server wraps one system"
  ],
  [
   "JSON-RPC over stdio or HTTP",
   "easy to build in Python or TypeScript"
  ],
  [
   "Treat servers as supply chain",
   "verify before you install"
  ]
 ],
 "fine": "Simplified message examples. See modelcontextprotocol.io for the full specification."
