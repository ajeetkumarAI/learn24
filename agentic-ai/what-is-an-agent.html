<script>window.LESSON = {
 "eyebrow": "Agentic AI · Foundations",
 "title": "What Is an AI Agent?",
 "color": "#45d19b",
 "lede": "A chatbot answers. An agent works towards a goal: it thinks, uses tools, looks at the result, and keeps going until the job is done.",
 "steps": [
  {
   "t": "Chatbot vs agent",
   "s": "Same model, different setup.",
   "b": [
    {
     "type": "table",
     "head": [
      "",
      "Chatbot",
      "Agent"
     ],
     "rows": [
      [
       "Output",
       "text reply",
       "actions + reply"
      ],
      [
       "Steps",
       "one",
       "many, chosen by the model"
      ],
      [
       "Tools",
       "none",
       "search, APIs, code, email…"
      ],
      [
       "Memory",
       "this chat",
       "task state + long-term memory"
      ]
     ]
    }
   ]
  },
  {
   "t": "The agent loop",
   "s": "Think → act → observe, repeated until the goal is met (often called ReAct).",
   "b": [
    {
     "type": "cycle",
     "nodes": [
      [
       "Think",
       "plan next step"
      ],
      [
       "Act",
       "call a tool"
      ],
      [
       "Observe",
       "read the result"
      ]
     ],
     "rounds": 2,
     "label": "until done"
    }
   ]
  },
  {
   "t": "A real task",
   "s": "Goal given to the agent:",
   "b": [
    {
     "type": "msg",
     "who": "User",
     "text": "Find the cheapest flight from Pune to Delhi next Friday morning and add it to my calendar."
    }
   ]
  },
  {
   "t": "Watch it work",
   "s": "Each line is one turn of the loop.",
   "b": [
    {
     "type": "trace",
     "lines": [
      [
       "thought",
       "I need flights PNQ → DEL on Friday before noon."
      ],
      [
       "action",
       "search_flights(from=\"PNQ\", to=\"DEL\", date=\"2026-10-30\", before=\"12:00\")"
      ],
      [
       "obs",
       "3 results: 6E-512 ₹4,890 06:10 · AI-850 ₹5,420 08:35 · UK-972 ₹6,100 09:50"
      ],
      [
       "thought",
       "Cheapest is 6E-512 at ₹4,890. Add it to the calendar."
      ],
      [
       "action",
       "calendar.add(title=\"6E-512 PNQ→DEL\", start=\"2026-10-30T06:10\", end=\"08:15\")"
      ],
      [
       "obs",
       "event created"
      ],
      [
       "final",
       "Cheapest is IndiGo 6E-512 at 06:10 for ₹4,890. It’s on your calendar."
      ]
     ]
    }
   ]
  },
  {
   "t": "What an agent is made of",
   "s": "Five parts, whatever framework you use.",
   "b": [
    {
     "type": "cards",
     "items": [
      [
       "LLM",
       "the reasoning engine that decides the next step"
      ],
      [
       "Tools",
       "functions it can call: APIs, search, code, DB"
      ],
      [
       "Memory",
       "short-term task state and long-term facts"
      ],
      [
       "Planner / loop",
       "controls steps, retries and when to stop"
      ],
      [
       "Guardrails",
       "permissions, approvals, budgets and logs"
      ]
     ]
    }
   ]
  },
  {
   "t": "When to use an agent",
   "s": "Agents cost more and are harder to test, so use them where steps aren’t known in advance.",
   "b": [
    {
     "type": "list",
     "items": [
      [
       "Good fit",
       "research, triage, multi-step support, data lookups across systems"
      ],
      [
       "Use a fixed workflow instead",
       "when the steps are always the same"
      ],
      [
       "Keep a human in the loop",
       "for payments, deletions and anything irreversible"
      ]
     ]
    }
   ]
  }
 ],
 "takeaways": [
  [
   "Agent = LLM + tools + loop",
   "plus memory and guardrails"
  ],
  [
   "The model chooses the steps",
   "that is the power and the risk"
  ],
  [
   "Start with a single agent",
   "add more only when needed"
  ],
  [
   "Secure it from day one",
   "see the OWASP Agentic Top 10 lesson"
  ]
 ],
 "fine": "Flight numbers and fares are illustrative."
};</script>
