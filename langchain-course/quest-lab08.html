<script type="application/json" id="quest-data">{"title": "Lab 08 Quest: Embeddings", "lesson": "lab08-embeddings.html", "next": "quest-lab09.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Embeddings: GPS coordinates for meaning", "html": "<div class=\"an\"><span>📍<\/span><div>Pune and Mumbai have close coordinates; Pune and London are far. Embeddings do this for <b>meanings<\/b>.<\/div><\/div><p>An embedding turns text into a list of numbers (a vector). Similar meaning → nearby vectors, even with different words: “lost credit card” is close to “stolen debit card”, far from “biryani recipe”.<\/p><pre><code>embeddings = HuggingFaceEmbeddings(model_name=&quot;sentence-transformers/all-MiniLM-L6-v2&quot;)\nvector = embeddings.embed_query(&quot;How do I block my lost card?&quot;)\nlen(vector)    # 384<\/code><\/pre>"}, {"type": "mcq", "q": "How many numbers are in an all-MiniLM-L6-v2 embedding?", "opts": ["3", "384", "1536", "1 million"], "a": 1, "why": "MiniLM gives 384 dimensions. OpenAI text-embedding-3-small gives 1536."}, {"type": "learn", "level": 2, "title": "Comparing vectors with cosine similarity", "html": "<pre><code>def cosine(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))<\/code><\/pre><p>1 = same direction (same meaning), 0 = unrelated. <code>embed_documents(list)<\/code> embeds your chunks once; <code>embed_query(text)<\/code> embeds each question.<\/p>"}, {"type": "mcq", "q": "Which call embeds the user’s question?", "opts": ["embeddings.embed_query(question)", "embeddings.embed_documents(question)", "embeddings.invoke(question)", "embeddings.split(question)"], "a": 0, "why": "One text, one vector. embed_documents takes a list of texts.", "code": true}, {"type": "learn", "level": 3, "title": "Choosing and caching models", "html": "<ul><li>Free: MiniLM (384), bge / e5 (768–1024, better quality).<\/li><li>Paid: OpenAI text-embedding-3-small (1536), Gemini embeddings.<\/li><\/ul><p><b>Golden rule:<\/b> use the same model for documents and questions; vectors from different models live in different spaces. <code>CacheBackedEmbeddings<\/code> stores vectors so the same text is never paid for twice.<\/p>"}, {"type": "mcq", "q": "You indexed documents with MiniLM, and questions are embedded with OpenAI. Result?", "opts": ["Meaningless similarity scores: different vector spaces", "Slightly slower search", "Better results", "No difference"], "a": 0, "why": "Always use the same embedding model for both sides."}, {"type": "scenario", "story": "Customers type “someone took my debit card” but your FAQ says “How to block a stolen card?”. A keyword search finds nothing useful.", "q": "Why do embeddings help here?", "opts": ["They match meaning, so “took” and “stolen” land close together", "They count exact words faster", "They translate to Hindi", "They make text shorter"], "a": 0, "why": "Semantic search finds the right FAQ even with different words."}, {"type": "interview", "q": "What are embeddings and how are they used in RAG?", "answer": "<p>Embeddings are dense vectors that represent the meaning of text. In RAG, every chunk is embedded once and stored in a vector store; at question time the question is embedded with the same model and the nearest chunks (by cosine or another distance) are retrieved and given to the LLM as context.<\/p>", "points": ["Dense vectors that capture meaning", "Chunks embedded once and stored", "Question embedded with the same model", "Nearest chunks retrieved as context"]}, {"type": "interview", "q": "How would you choose an embedding model for a production system?", "answer": "<p>Check quality on your own data (and benchmarks like MTEB), language support (e.g. Hindi), dimension size (storage and speed), cost and latency, data privacy (self-hosted vs API) and maximum input length. Re-embedding everything is needed if you change models, so choose carefully and version your index.<\/p>", "points": ["Quality on your data / MTEB", "Language support", "Cost, latency, dimensions", "Privacy and re-indexing cost"]}]}</script>
