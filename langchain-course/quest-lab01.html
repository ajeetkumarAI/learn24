<script type="application/json" id="quest-data">{"title": "Lab 01 Quest: LLMs & Chat Models", "lesson": "lab01-chat-models.html", "next": "quest-lab02.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "A chat model: messages in, one message out", "html": "<div class=\"an\"><span>📺<\/span><div>LangChain is like a <b>universal TV remote<\/b>: the same buttons work for Groq, OpenAI, Gemini or a local model.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">Your messages<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">ChatGroq<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">AIMessage<\/b><\/div><p>You create the model once, then call it. The answer comes back as an <code>AIMessage<\/code>; the text is in <code>.content<\/code>.<\/p><pre><code>from langchain_groq import ChatGroq\nllm = ChatGroq(model=&quot;openai/gpt-oss-20b&quot;)\nresponse = llm.invoke(&quot;Give me a short example of AI use in daily life?&quot;)\nprint(response.content)<\/code><\/pre>"}, {"type": "mcq", "q": "What type of object does <code>llm.invoke(\"…\")<\/code> return?", "opts": ["A plain Python string", "An <code>AIMessage<\/code> object", "A list of tokens", "A JSON file"], "a": 1, "why": "invoke() returns an AIMessage. Use <code>.content<\/code> for the text and <code>.usage_metadata<\/code> for token counts."}, {"type": "learn", "level": 2, "title": "Four ways to call, and messages with roles", "html": "<ul><li><b>invoke<\/b>: one question, full answer.<\/li><li><b>stream<\/b>: words arrive one by one, like ChatGPT typing.<\/li><li><b>batch<\/b>: many questions in parallel.<\/li><li><b>ainvoke<\/b>: async, for web servers like FastAPI.<\/li><\/ul><p>Messages give roles: <code>SystemMessage<\/code> sets the rules, <code>HumanMessage<\/code> asks, and an <code>AIMessage<\/code> can be an <i>example answer<\/i> (few-shot).<\/p><pre><code>messages = [\n    SystemMessage(&quot;You are a funny teacher. Answer in 2 lines.&quot;),\n    HumanMessage(&quot;What is gravity?&quot;),\n]\nllm.invoke(messages)<\/code><\/pre>"}, {"type": "mcq", "q": "Your chatbot must show the answer word by word as it is generated. Which call do you use?", "opts": ["for chunk in llm.stream(q): print(chunk.content, end=\"\")", "llm.batch([q])", "llm.invoke(q).content", "llm.profile"], "a": 0, "why": "stream() yields chunks as they arrive, so users see text immediately.", "code": true}, {"type": "learn", "level": 3, "title": "Parameters, tokens and any provider", "html": "<p><b>temperature<\/b> controls creativity: 0 = almost the same answer every time (facts, JSON, classification), 1 = creative (taglines, stories). <b>max_tokens<\/b> caps the answer length; <b>timeout<\/b> and <b>max_retries<\/b> make production calls safe.<\/p><p><code>response.usage_metadata<\/code> shows input, output and total tokens: your bill. <code>llm.profile<\/code> shows the context window (131,072 tokens for gpt-oss-20b) and whether tool calling and structured output are supported.<\/p><pre><code>from langchain.chat_models import init_chat_model\nllm = init_chat_model(&quot;groq:openai/gpt-oss-20b&quot;, temperature=0)\n# switch provider by changing only this string: &quot;openai:gpt-4o-mini&quot;, &quot;ollama:llama3.1&quot;<\/code><\/pre>"}, {"type": "mcq", "q": "A UPI-fraud classifier must give the same label every time for the same SMS. Which setting?", "opts": ["temperature=0", "temperature=1", "max_tokens=1", "streaming=True"], "a": 0, "why": "Low temperature makes the output predictable, which is what classification needs.", "hint": "Think: creative or predictable?"}, {"type": "scenario", "story": "Your manager asks you to move the app from Groq to OpenAI next month, but nobody wants to rewrite 40 files of code.", "q": "What is the cleanest LangChain way to make that switch easy?", "opts": ["Write <code>init_chat_model(\"provider:model\")<\/code> in one place and use it everywhere", "Copy-paste the OpenAI SDK into every file", "Ask the LLM to translate the code", "Keep two separate apps"], "a": 0, "why": "All LangChain chat models share invoke/stream/batch, so changing one model string switches the provider."}, {"type": "interview", "q": "What is the difference between invoke, stream and batch in LangChain?", "answer": "<p><b>invoke<\/b> sends one input and waits for the full output. <b>stream<\/b> returns the output in chunks as it is generated: same total time, but the user sees text immediately, which matters for chat UIs. <b>batch<\/b> runs many inputs in parallel (control it with <code>max_concurrency<\/code>), useful for bulk jobs like classifying thousands of tickets. All have async versions (ainvoke, astream, abatch), and every Runnable supports them, not just models.<\/p>", "points": ["invoke = one input, full answer", "stream = chunks for better user experience", "batch = many inputs in parallel (max_concurrency)", "async versions exist for web servers"]}, {"type": "interview", "q": "Why would you use LangChain instead of calling the provider SDK directly?", "answer": "<p>LangChain gives one standard interface for all providers, so switching models is a one-line change. Responses have a standard shape (<code>.content<\/code>, <code>.usage_metadata<\/code>). It also plugs models into prompts, chains, RAG, tools and agents, and gives streaming, batching and tracing (LangSmith) for free. The trade-off is an extra layer: for a single simple call, the raw SDK can be simpler.<\/p>", "points": ["Same interface for every provider", "Standard response object", "Plugs into chains, RAG, agents", "Honest trade-off: extra layer for simple cases"]}]}</script>
