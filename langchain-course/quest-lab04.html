<script type="application/json" id="quest-data">{"title": "Lab 04 Quest: Chains with LCEL & Runnables", "lesson": "lab04-lcel-chains.html", "next": "quest-lab05.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "A chain is an assembly line", "html": "<div class=\"an\"><span>🏭<\/span><div>Like a <b>dosa counter<\/b>: one person pours batter, the next adds masala, the last folds and serves.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">{\"topic\": \"Blockchain\"}<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">PromptTemplate<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">ChatGroq<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">StrOutputParser<\/b><em>→<\/em><b style=\"animation-delay:0.60s\">\"Blockchain is…\"<\/b><\/div><pre><code>chain = prompt | llm | StrOutputParser()\nchain.invoke({&quot;topic&quot;: &quot;Blockchain&quot;})<\/code><\/pre><p>The <code>|<\/code> pipe passes the output of the left step to the right step. Every chain gets invoke, stream and batch for free.<\/p>"}, {"type": "order", "q": "Put the steps of <code>prompt | llm | StrOutputParser()<\/code> in the order data flows:", "items": ["Input dict {\"topic\": …}", "PromptTemplate fills the blanks", "LLM writes an AIMessage", "StrOutputParser returns text"], "why": "Each step’s output becomes the next step’s input."}, {"type": "learn", "level": 2, "title": "Shaping data with runnables", "html": "<ul><li><code>{\"title\": title_chain} | blog_chain<\/code>: a dict builds the next input (sequential).<\/li><li><code>RunnablePassthrough.assign(title=chain)<\/code>: keep the input, add a key.<\/li><li><code>RunnableParallel(summary=…, sentiment=…, keywords=…)<\/code>: branches run at the same time.<\/li><li><code>RunnableLambda(fn)<\/code>: any Python function as a step.<\/li><\/ul>"}, {"type": "mcq", "q": "You want <code>{\"topic\": \"EVs\", \"title\": \"…\"}<\/code>: keep the input and add a title. Which runnable?", "opts": ["RunnablePassthrough.assign(title=title_chain)", "RunnableLambda(title_chain)", "StrOutputParser()", "RunnableBranch(title_chain)"], "a": 0, "why": ".assign keeps the original keys and adds new ones."}, {"type": "learn", "level": 3, "title": "Routing and production safety", "html": "<pre><code>router = RunnablePassthrough.assign(kind=classify_chain) | RunnableBranch(\n    (lambda x: &quot;coding&quot; in x[&quot;kind&quot;].lower(), coding_chain),\n    general_chain,                      # default\n)\nsafe_llm = bad_llm.with_fallbacks([llm])   # backup model\nretry_llm = llm.with_retry(stop_after_attempt=3)<\/code><\/pre><p>A chain is a <b>fixed path<\/b>. When the LLM must decide which tool to call next in a loop, you need an <b>agent<\/b> (Lab 13).<\/p>"}, {"type": "mcq", "q": "Your primary model sometimes returns errors. Which line switches to a backup model automatically?", "opts": ["safe = primary.with_fallbacks([backup])", "safe = primary | backup", "safe = RunnableParallel(primary, backup)", "safe = backup.partial(primary)"], "a": 0, "why": "with_fallbacks tries the next runnable when the first raises an error.", "code": true}, {"type": "scenario", "story": "For every hotel review you need a summary, the sentiment and 3 keywords. Today you call three chains one after another and it takes 6 seconds.", "q": "How do you make it faster with LCEL?", "opts": ["Wrap the three chains in RunnableParallel", "Use RunnableBranch", "Lower temperature", "Join them with | in a row"], "a": 0, "why": "RunnableParallel runs branches at the same time on the same input, so total time ≈ the slowest branch."}, {"type": "interview", "q": "What is LCEL and what are its benefits?", "answer": "<p>LCEL (LangChain Expression Language) composes Runnables with the <code>|<\/code> operator. Benefits: readable pipelines, streaming, batching and async for free, parallel execution with RunnableParallel, fallbacks and retries, and full tracing in LangSmith. Its limit: a chain is a fixed path, so dynamic decisions need an agent or LangGraph.<\/p>", "points": ["Pipe | composes Runnables", "Stream/batch/async for free", "Parallel, fallbacks, retries", "Limit: fixed path → agent/LangGraph"]}, {"type": "interview", "q": "When would you choose a chain over an agent?", "answer": "<p>When the steps are known in advance (summarise, classify, extract, RAG answer). Chains are cheaper, faster, predictable and easier to test. Choose an agent only when the model must decide which tools to call and in what order.<\/p>", "points": ["Fixed, known steps → chain", "Cheaper, faster, predictable", "Easier to test", "Agent only for dynamic tool decisions"]}]}</script>
