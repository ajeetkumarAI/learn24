<script type="application/json" id="quest-data">{"title": "Lab 09 Quest: Vector Stores", "lesson": "lab09-vector-stores.html", "next": "quest-lab10.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "A vector store is a library catalogue for meanings", "html": "<div class=\"an\"><span>📚<\/span><div>Instead of reading every book, look up the <b>catalogue<\/b> and go straight to the right shelf.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">chunks<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">embed_documents<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">vector store<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">similarity_search<\/b><\/div><p>It keeps vector + text + metadata together and finds the nearest chunks in milliseconds. Learning: <code>InMemoryVectorStore<\/code>. Local file: <code>FAISS<\/code>. Local database: <code>Chroma<\/code>. Production: Pinecone, Qdrant, Weaviate, pgvector, Azure AI Search.<\/p>"}, {"type": "mcq", "q": "Which store is a local database that persists to disk and supports metadata filters and delete by id?", "opts": ["Chroma", "InMemoryVectorStore", "A Python list", "StrOutputParser"], "a": 0, "why": "Chroma with persist_directory survives restarts."}, {"type": "learn", "level": 2, "title": "Scores: similarity or distance?", "html": "<p>InMemory and Chroma return <b>similarity<\/b>: higher is closer. FAISS by default returns <b>L2 distance<\/b>: <b>lower<\/b> is closer, 0 is identical.<\/p><pre><code>for doc, score in faiss_store.similarity_search_with_score(&quot;loan interest rate&quot;, k=3):\n    print(round(score, 3), doc.page_content)     # LOWER = more similar\nfaiss_store.save_local(&quot;faiss_bank_index&quot;)<\/code><\/pre>"}, {"type": "mcq", "q": "FAISS returns scores 0.31 and 1.27 for two chunks. Which is more similar?", "opts": ["0.31", "1.27", "Both equal", "Cannot tell"], "a": 0, "why": "FAISS gives distance by default: lower = closer.", "hint": "Is it similarity or distance?"}, {"type": "learn", "level": 3, "title": "Filters, MMR and safe loading", "html": "<pre><code>store.similarity_search(&quot;limit&quot;, k=2, filter={&quot;topic&quot;: &quot;upi&quot;})\nstore.max_marginal_relevance_search(&quot;card rules&quot;, k=2, fetch_k=6)<\/code><\/pre><p><b>Metadata filters<\/b> search inside one topic, user or date range. <b>MMR<\/b> picks results that are relevant and different from each other. FAISS indexes are saved with pickle, so <code>allow_dangerous_deserialization=True<\/code> is needed: only load files <b>you<\/b> created.<\/p>"}, {"type": "mcq", "q": "Search only inside UPI documents. Which line?", "opts": ["store.similarity_search(\"limit\", k=2, filter={\"topic\": \"upi\"})", "store.similarity_search(\"upi limit\", k=100)", "store.delete(topic=\"upi\")", "store.as_retriever(upi=True)"], "a": 0, "why": "A metadata filter restricts the search space.", "code": true}, {"type": "scenario", "story": "An HR bot is used by employees in India and the UK, and must never show UK salary policy to Indian employees.", "q": "What should you use?", "opts": ["Store <code>country<\/code> metadata on each chunk and filter by the user’s country", "Ask the LLM to ignore UK text", "Use a bigger k", "Use MMR"], "a": 0, "why": "Filter at retrieval time so the wrong documents never reach the LLM."}, {"type": "interview", "q": "What is a vector database and how does it search fast?", "answer": "<p>A vector database stores embeddings with their text and metadata and finds the nearest vectors to a query. For speed at scale it uses approximate nearest neighbour (ANN) indexes such as HNSW or IVF instead of comparing against every vector, trading a little accuracy for big speed gains. It also supports metadata filtering, updates and deletes.<\/p>", "points": ["Stores vectors + text + metadata", "Nearest-neighbour search", "ANN indexes (HNSW / IVF) for speed", "Filtering, updates, deletes"]}, {"type": "interview", "q": "FAISS vs Chroma vs a managed vector DB: how do you choose?", "answer": "<p>FAISS: a fast library, local, great for prototypes and offline work, but you manage persistence. Chroma: an easy local database with persistence and metadata filters. Managed (Pinecone, Qdrant Cloud, pgvector, Azure AI Search): scaling, replication, security and multi-user access for production. Choose by data size, ops effort, filtering needs and where your data must live.<\/p>", "points": ["FAISS: fast local library", "Chroma: simple persistent local DB", "Managed: scale, security, ops", "Choose by size, filters, compliance"]}]}</script>
