<script type="application/json" id="quest-data">{"title": "Lab 11 Quest: RAG: Chat with your PDF", "lesson": "lab11-rag-chat-with-pdf.html", "next": "quest-lab12.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "RAG is an open-book exam", "html": "<div class=\"an\"><span>📖<\/span><div>A student allowed to open the textbook finds the right page and answers exactly, and can say “page 47”.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">Load<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">Split<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">Embed<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">Store<\/b><em>→<\/em><b style=\"animation-delay:0.60s\">Retrieve<\/b><em>→<\/em><b style=\"animation-delay:0.75s\">Generate<\/b><\/div><p>Load → Split → Embed → Store happen <b>once<\/b> (indexing). Retrieve → Generate happen <b>for every question<\/b>.<\/p>"}, {"type": "order", "q": "Put the RAG steps in order:", "items": ["Load the PDF", "Split into chunks", "Embed the chunks", "Store in a vector store", "Retrieve top chunks", "Generate the answer"], "why": "Steps 1–4 build the index; steps 5–6 answer each question."}, {"type": "learn", "level": 2, "title": "The RAG chain in LCEL", "html": "<pre><code>rag_chain = (\n    {&quot;context&quot;: retriever | format_docs, &quot;question&quot;: RunnablePassthrough()}\n    | prompt | llm | StrOutputParser()\n)<\/code><\/pre><p>The dict runs two branches: the retriever fetches context, and <code>RunnablePassthrough<\/code> keeps the question. The system prompt says: <i>Answer ONLY from the context. If it is not there, say “I don’t know based on the document.”<\/i><\/p>"}, {"type": "mcq", "q": "In the RAG chain, what does RunnablePassthrough() do?", "opts": ["Passes the question unchanged next to the retrieved context", "Deletes the question", "Embeds the PDF", "Calls the LLM twice"], "a": 0, "why": "The prompt needs both {context} and {question}."}, {"type": "learn", "level": 3, "title": "Sources and follow-up questions", "html": "<p>Return the retrieved docs with the answer so the UI can show “Sources: page 3”. For follow-ups like “How long did it take to train <b>it<\/b>?”, first <b>rewrite<\/b> the question with the chat history into a standalone question, then retrieve.<\/p><pre><code>standalone = rewrite_chain.invoke({&quot;history&quot;: history, &quot;question&quot;: q})\nanswer = rag_chain.invoke(standalone)<\/code><\/pre>"}, {"type": "mcq", "q": "A user asks “What about its fee?” after asking about credit cards. Retrieval fails. Why?", "opts": ["“its” has no meaning without history: rewrite it into a standalone question first", "The PDF is too small", "Temperature is 0", "FAISS is broken"], "a": 0, "why": "Conversational RAG rewrites follow-ups before retrieving."}, {"type": "scenario", "story": "Your RAG bot confidently answers “Who won the 2011 cricket world cup?” from a banking PDF, using its own knowledge.", "q": "What should you add?", "opts": ["A strict system rule: answer only from context, else say “I don’t know based on the document”", "More chunks", "A larger k", "stream()"], "a": 0, "why": "Grounding rules make the bot honest when the document has no answer."}, {"type": "interview", "q": "Explain the RAG architecture end to end.", "answer": "<p>Indexing: load documents, split them into chunks with metadata, embed each chunk and store vectors in a vector database. Query time: embed the question (same model), retrieve the top-k chunks (often hybrid + re-ranking), put them into a prompt with grounding rules, and let the LLM generate an answer with citations. Evaluate faithfulness and relevance, and re-index when documents change.<\/p>", "points": ["Indexing: load, split, embed, store", "Query: embed question, retrieve top-k", "Prompt with grounding + citations", "Evaluate and keep the index fresh"]}, {"type": "interview", "q": "How do you reduce hallucinations in a RAG system?", "answer": "<p>Improve retrieval (chunking, hybrid search, re-ranking), instruct the model to answer only from context and say “I don’t know”, return sources, use low temperature, set a relevance threshold, and evaluate faithfulness (for example with RAGAS) on a test set.<\/p>", "points": ["Better retrieval", "Grounding instruction + “I don’t know”", "Citations and low temperature", "Evaluate faithfulness"]}]}</script>
