<script type="application/json" id="quest-data">{"title": "Lab 15 Quest: Callbacks, Caching, Rate Limits & LangSmith", "lesson": "lab15-callbacks-cache-ratelimit-langsmith.html", "next": "quest-lab16.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Callbacks: the dashboard", "html": "<div class=\"an\"><span>🚗<\/span><div>Callbacks are the <b>dashboard<\/b>, cache is <b>remembering the route<\/b>, the rate limiter is the <b>speed limit<\/b>, LangSmith is the <b>dashcam<\/b>.<\/div><\/div><pre><code>class MyLogger(BaseCallbackHandler):\n    def on_chat_model_start(self, serialized, messages, **kw): ...\n    def on_llm_end(self, response, **kw): ...      # time + tokens\n    def on_llm_new_token(self, token, **kw): ...   # streaming\nllm.invoke(q, config={&quot;callbacks&quot;: [MyLogger()]})<\/code><\/pre>"}, {"type": "mcq", "q": "Which callback method fires for every streamed token?", "opts": ["on_llm_new_token", "on_chain_end", "on_tool_start", "on_retriever_end"], "a": 0, "why": "Use it to print or forward tokens live."}, {"type": "learn", "level": 2, "title": "Cache and rate limiter", "html": "<pre><code>set_llm_cache(InMemoryCache())          # or SQLiteCache(&quot;cache.db&quot;)\nlimiter = InMemoryRateLimiter(requests_per_second=0.5, max_bucket_size=1)\nllm = ChatGroq(model=&quot;openai/gpt-oss-20b&quot;, rate_limiter=limiter)<\/code><\/pre><p>Same prompt twice → second answer from the cache, instant and free. 0.5 requests per second = one call every 2 seconds, so you stay under free-tier limits instead of getting HTTP 429.<\/p>"}, {"type": "mcq", "q": "<code>requests_per_second=0.5<\/code> means…", "opts": ["One call every 2 seconds", "Five calls per second", "Half the tokens", "No limit"], "a": 0, "why": "0.5 calls per second = 1 call per 2 seconds."}, {"type": "learn", "level": 3, "title": "Concurrency and tracing", "html": "<p>5 questions at 0.8 s each: one by one ≈ 4 s, <code>batch(max_concurrency=2)<\/code> ≈ 2 s, <code>asyncio.gather<\/code> of <code>ainvoke<\/code> ≈ 1 s.<\/p><pre><code>os.environ[&quot;LANGSMITH_TRACING&quot;] = &quot;true&quot;\nos.environ[&quot;LANGSMITH_API_KEY&quot;] = userdata.get(&quot;langsmith_key&quot;)\nos.environ[&quot;LANGSMITH_PROJECT&quot;] = &quot;langchain-handson&quot;<\/code><\/pre><p>LangSmith records every step: inputs, outputs, tokens, latency and errors.<\/p>"}, {"type": "mcq", "q": "Which caching decision is WRONG?", "opts": ["Caching each customer’s account balance answer and sharing it with all users", "Caching FAQ answers", "Caching temperature-0 classifications", "Using SQLiteCache to survive restarts"], "a": 0, "why": "Never share personal answers across users through a cache."}, {"type": "scenario", "story": "Your demo on Groq’s free tier fails with “429 Too Many Requests” when 30 students click at once.", "q": "What helps immediately?", "opts": ["A rate limiter plus caching repeated questions", "A higher temperature", "Removing the system prompt", "Longer prompts"], "a": 0, "why": "Space out calls and avoid repeated ones."}, {"type": "interview", "q": "How do you monitor and debug an LLM application in production?", "answer": "<p>Trace every run (LangSmith or OpenTelemetry) with inputs, outputs, tool calls, tokens, latency and errors; tag runs by user, version and feature; track cost and latency dashboards; collect user feedback; build evaluation datasets from real traces and run them before prompt or model changes; alert on error spikes.<\/p>", "points": ["Tracing of every step", "Tokens, cost, latency metrics", "Feedback and datasets", "Evaluation before changes + alerts"]}, {"type": "interview", "q": "How do you reduce LLM API cost?", "answer": "<p>Cache repeated prompts, trim or summarise history, retrieve fewer and better chunks, use smaller models for simple tasks (routing), set max_tokens, batch offline work, and measure tokens per feature to find the biggest spenders.<\/p>", "points": ["Caching", "Shorter context", "Smaller models / routing", "Measure tokens per feature"]}]}</script>
