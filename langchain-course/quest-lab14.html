<script type="application/json" id="quest-data">{"title": "Lab 14 Quest: Middleware & Guardrails", "lesson": "lab14-middleware-guardrails.html", "next": "quest-lab15.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Middleware: airport security for agents", "html": "<div class=\"an\"><span>🛂<\/span><div>Checks happen at fixed points of the journey; the plane does not change. Middleware adds checks around the agent loop.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">before_model<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">MODEL<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">after_model<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">TOOLS (wrap_tool_call)<\/b><\/div><p>Use it to trim history, hide personal data, block unsafe answers, log, limit or approve tool calls, all without changing the agent.<\/p>"}, {"type": "mcq", "q": "Which hook can block an unsafe answer after the model writes it?", "opts": ["@after_model", "@before_agent", "trim_messages", "MessagesPlaceholder"], "a": 0, "why": "after_model sees the model output and can jump to the end."}, {"type": "learn", "level": 2, "title": "PII and human approval", "html": "<pre><code>PIIMiddleware(&quot;email&quot;, strategy=&quot;redact&quot;, apply_to_input=True)       # [REDACTED_EMAIL]\nPIIMiddleware(&quot;credit_card&quot;, strategy=&quot;mask&quot;, apply_to_input=True)   # **** **** **** 1111\nHumanInTheLoopMiddleware(interrupt_on={&quot;transfer_money&quot;: True})<\/code><\/pre><p>Human-in-the-loop needs a <b>checkpointer<\/b>: the agent pauses (<code>r[\"__interrupt__\"]<\/code>) and resumes with <code>Command(resume={\"decisions\": [{\"type\": \"approve\"}]})<\/code> or a reject with a message.<\/p>"}, {"type": "mcq", "q": "How do you continue an agent after a manager approves the paused transfer?", "opts": ["agent.invoke(Command(resume={\"decisions\": [{\"type\": \"approve\"}]}), config)", "agent.invoke(\"approve\")", "Restart Colab", "transfer_money.invoke()"], "a": 0, "why": "Resume the same thread with a decision.", "code": true}, {"type": "learn", "level": 3, "title": "Limits, fallbacks and custom guards", "html": "<ul><li><code>ToolCallLimitMiddleware(tool_name=\"transfer_money\", run_limit=1)<\/code>: the second transfer gets “Tool call limit exceeded”.<\/li><li><code>ModelCallLimitMiddleware<\/code>: stops runaway loops and bills.<\/li><li><code>ModelFallbackMiddleware<\/code>: backup model on outages.<\/li><li><code>SummarizationMiddleware<\/code>: long chats.<\/li><li>Custom <code>@wrap_model_call<\/code>: a cheap model for short chats, a strong one for long chats.<\/li><\/ul>"}, {"type": "mcq", "q": "An agent tried to transfer money 4 times in one run. Which middleware stops this?", "opts": ["ToolCallLimitMiddleware", "PIIMiddleware", "SummarizationMiddleware", "ModelFallbackMiddleware"], "a": 0, "why": "Set a run_limit for risky tools."}, {"type": "scenario", "story": "A mutual-fund sales agent sometimes promises “guaranteed returns”, which breaks regulations.", "q": "Which guardrail fits best?", "opts": ["An @after_model compliance guard that replaces banned phrases with a blocked message", "A bigger model", "More tools", "Higher temperature"], "a": 0, "why": "Check every answer before it reaches the customer."}, {"type": "interview", "q": "How would you make an LLM agent safe for a banking use case?", "answer": "<p>Least-privilege tools; human-in-the-loop approval for money movement; PII redaction or masking before the model; input checks for prompt injection; output compliance checks; tool and model call limits; fallbacks and retries; full audit logs and tracing; never collect OTP/PIN; test with red-teaming.<\/p>", "points": ["Approval for risky actions", "PII protection", "Input/output guardrails", "Limits, audit logs, red-teaming"]}, {"type": "interview", "q": "What is human-in-the-loop and how is it implemented in LangChain/LangGraph?", "answer": "<p>The agent pauses before a sensitive action until a person approves, edits or rejects it. In LangChain v1, HumanInTheLoopMiddleware with interrupt_on and a checkpointer creates an interrupt; the app shows the pending action and resumes with Command(resume=decisions). In LangGraph you can use interrupt() or interrupt_before nodes.<\/p>", "points": ["Pause before sensitive actions", "Approve / edit / reject", "Needs a checkpointer", "Resume with Command(resume=…)"]}]}</script>
