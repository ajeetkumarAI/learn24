<script type="application/json" id="quest-data">{"title": "Lab 13 Quest: Agents with create_agent", "lesson": "lab13-agents-create-agent.html", "next": "quest-lab14.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Agent = LLM + tools + loop", "html": "<div class=\"an\"><span>🧳<\/span><div>A <b>ticket counter<\/b> follows a fixed script (chain). A <b>travel agent<\/b> decides what to check next (agent).<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">Think<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">Call tool<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">Observe result<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">Repeat…<\/b><em>→<\/em><b style=\"animation-delay:0.60s\">Answer<\/b><\/div><p>This is the <b>ReAct<\/b> pattern (Reason + Act). In a chain <i>you<\/i> fix the steps; in an agent the <i>LLM<\/i> decides them.<\/p>"}, {"type": "mcq", "q": "What is the key difference between a chain and an agent?", "opts": ["In an agent the LLM decides the next step", "Agents never use tools", "Chains cannot use LLMs", "Agents are always cheaper"], "a": 0, "why": "Fixed path vs a path the model chooses."}, {"type": "learn", "level": 2, "title": "create_agent in LangChain v1", "html": "<pre><code>agent = create_agent(\n    model=llm,\n    tools=[get_weather, convert_currency],\n    system_prompt=&quot;You are a helpful travel assistant. Keep answers short.&quot;,\n)\nresult = agent.invoke({&quot;messages&quot;: [{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Goa with 500 USD?&quot;}]})\nresult[&quot;messages&quot;][-1].content<\/code><\/pre><p>The result holds every step: human → AI tool calls → tool results → final AI answer. <code>stream_mode=\"updates\"<\/code> shows each step live. Old <code>initialize_agent<\/code> / <code>AgentExecutor<\/code> are replaced by <b>create_agent<\/b>.<\/p>"}, {"type": "order", "q": "Order the messages in the Goa travel run:", "items": ["human: “Goa with 500 USD…”", "ai: tool calls convert_currency + get_weather", "tool: 500.0 USD = 42000.0 INR", "tool: 30°C, sunny", "ai: final answer"], "why": "The agent stops when the AI replies without tool calls."}, {"type": "learn", "level": 3, "title": "Memory and structured answers", "html": "<pre><code>agent = create_agent(llm, tools, checkpointer=InMemorySaver())\ncfg = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;ajeet-1&quot;}}\nagent.invoke({&quot;messages&quot;: [...]}, cfg)        # remembers within this thread\n\nplan_agent = create_agent(llm, tools, response_format=TripPlan)\nplan_agent.invoke({...})[&quot;structured_response&quot;]    # a TripPlan object<\/code><\/pre><p>Same <code>thread_id<\/code> = same memory; a new thread starts fresh.<\/p>"}, {"type": "mcq", "q": "Which code gives each customer a separate agent memory?", "opts": ["config={\"configurable\": {\"thread_id\": customer_id}} with a checkpointer", "temperature=customer_id", "tools=[customer_id]", "system_prompt=customer_id"], "a": 0, "why": "The checkpointer saves state per thread_id.", "code": true}, {"type": "scenario", "story": "A NovaBank support agent has <code>search_policy<\/code> and <code>block_card<\/code> tools. A customer says “block my card, here is my OTP 482913”.", "q": "What should the design ensure?", "opts": ["The system prompt and guardrails say never ask for or use OTP / PIN / full card number; block using only the last 4 digits", "Store the OTP for later", "Use the OTP as a tool argument", "Disable all tools"], "a": 0, "why": "Never collect secrets in chat. Add middleware (Lab 14) for PII too."}, {"type": "interview", "q": "How does a ReAct agent work, and what are its risks?", "answer": "<p>The model reasons about the task, chooses a tool with arguments, the runtime executes it, and the observation is fed back; this repeats until the model answers. Risks: infinite loops and cost (add call limits), wrong or dangerous tool calls (validate, require approval), prompt injection through tool results, and hard debugging (use tracing).<\/p>", "points": ["Reason → act → observe loop", "Runtime executes tools", "Risks: loops/cost, unsafe actions", "Mitigations: limits, approval, tracing"]}, {"type": "interview", "q": "How do you add memory to a LangChain v1 agent?", "answer": "<p>Pass a checkpointer (InMemorySaver for learning; SQLite or Postgres savers in production) to create_agent and call it with a thread_id in the config. The full message state is saved per thread after every step. Use trimming or summarisation middleware for long threads, and a store for long-term facts across threads.<\/p>", "points": ["checkpointer in create_agent", "thread_id in config", "Persistent saver in production", "Trim / summarise; store for long-term"]}]}</script>
