<script type="application/json" id="quest-data">{"title": "Lab 05 Quest: Memory & Chat History", "lesson": "lab05-memory-chat-history.html", "next": "quest-lab06.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "LLMs are stateless", "html": "<div class=\"an\"><span>🩺<\/span><div>Like a <b>doctor<\/b> who remembers no patient: the nurse puts your file on the table before every visit.<\/div><\/div><p>Each <code>llm.invoke()<\/code> is independent. Ask “my name is Ajeet”, then “what is my name?”, and the model does not know. <b>Memory = sending the old messages again.<\/b><\/p><pre><code>chat_history = [SystemMessage(&quot;You are friendly.&quot;)]\ndef chat(text):\n    chat_history.append(HumanMessage(text))\n    reply = llm.invoke(chat_history)\n    chat_history.append(AIMessage(reply.content))\n    return reply.content<\/code><\/pre>"}, {"type": "mcq", "q": "Why does the model forget your name between two invoke() calls?", "opts": ["Each call is independent: the model only sees the messages you send", "Groq deletes data every minute", "The temperature is too high", "The name was too long"], "a": 0, "why": "Memory is the application’s job: resend history."}, {"type": "learn", "level": 2, "title": "Memory per user with session_id", "html": "<pre><code>chatbot = RunnableWithMessageHistory(\n    prompt | llm, get_session_history,\n    input_messages_key=&quot;input&quot;, history_messages_key=&quot;history&quot;)\nchatbot.invoke({&quot;input&quot;: &quot;I like mountains.&quot;},\n               config={&quot;configurable&quot;: {&quot;session_id&quot;: &quot;ajeet&quot;}})<\/code><\/pre><p><code>get_session_history(session_id)<\/code> returns one history per user, so Ajeet and Priya never see each other’s chats. <code>FileChatMessageHistory<\/code> saves to disk and survives restarts.<\/p>"}, {"type": "mcq", "q": "Two customers use the same bot. What keeps their memories separate?", "opts": ["A different session_id in the config", "A different temperature", "A different system prompt", "Different Groq keys"], "a": 0, "why": "The history store is keyed by session_id."}, {"type": "learn", "level": 3, "title": "Cost control and the v1 way", "html": "<p>With buffer memory, turn 20 resends about 40 messages, so cost grows every turn. Options:<\/p><ul><li><b>Window<\/b>: <code>trim_messages(strategy=\"last\")<\/code> keeps recent messages.<\/li><li><b>Summary<\/b>: the LLM summarises old turns (<code>SummarizationMiddleware<\/code>).<\/li><li><b>Long-term<\/b>: store facts in a database.<\/li><\/ul><p>In LangChain 1.x, <code>RunnableWithMessageHistory<\/code> prints a deprecation warning; for agents, use a <b>checkpointer + thread_id<\/b>.<\/p>"}, {"type": "mcq", "q": "A support chat runs for 2 hours and the token bill keeps rising. First thing to add?", "opts": ["trim_messages or a summary of old turns", "A second LLM call per turn", "batch()", "A bigger model"], "a": 0, "why": "Send only what the model needs: recent turns or a summary."}, {"type": "scenario", "story": "A hospital appointment bot must remember the patient’s name, age and symptoms across a 10-minute chat, and also after the server restarts.", "q": "Which memory setup fits?", "opts": ["A persistent history (file/DB or checkpointer) keyed by the patient’s session id", "A Python global list", "temperature=0", "No memory: ask again every turn"], "a": 0, "why": "Persistent storage survives restarts; a session key keeps patients separate."}, {"type": "interview", "q": "How do you implement conversation memory in LangChain?", "answer": "<p>LLMs are stateless, so you store messages and resend them. Classic: a ChatPromptTemplate with MessagesPlaceholder and RunnableWithMessageHistory keyed by session_id, with in-memory, file or database history. In LangChain 1.x agents, use a LangGraph checkpointer with a thread_id. Control cost with trimming or summarisation, and use a store for long-term facts.<\/p>", "points": ["Stateless → resend history", "Per-user key (session_id / thread_id)", "Persistent store for restarts", "Trim or summarise for cost"]}, {"type": "interview", "q": "Explain buffer, window and summary memory and their trade-offs.", "answer": "<p><b>Buffer<\/b> keeps everything: perfect recall, cost grows. <b>Window<\/b> keeps the last k turns: cheap, forgets old facts. <b>Summary<\/b> keeps an LLM-written summary: remembers key facts in fewer tokens, but costs an extra call and may lose detail.<\/p>", "points": ["Buffer: all, costly", "Window: last k, forgets", "Summary: compact, extra LLM call", "Pick by chat length and cost"]}]}</script>
