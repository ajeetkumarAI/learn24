<script type="application/json" id="quest-data">{"title": "Lab 07 Quest: Text Splitters (Chunking)", "lesson": "lab07-text-splitters.html", "next": "quest-lab08.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Why we cut documents into chunks", "html": "<div class=\"an\"><span>🚆<\/span><div>Like a <b>long train cut into coaches<\/b>: each coach is easy to move, and the vestibule between coaches (overlap) keeps nothing from falling through.<\/div><\/div><ul><li>Models have input limits.<\/li><li>Small focused chunks make search more accurate.<\/li><li>Fewer tokens per answer = lower cost.<\/li><\/ul><p><b>chunk_size<\/b> = maximum size of a chunk. <b>chunk_overlap<\/b> = text repeated from the previous chunk so a sentence on the boundary stays whole.<\/p>"}, {"type": "mcq", "q": "What is chunk_overlap for?", "opts": ["So a sentence on a chunk boundary is complete in at least one chunk", "To make the index smaller", "To speed up embeddings", "To remove duplicates"], "a": 0, "why": "Overlap repeats a little text so meaning is not cut in half."}, {"type": "learn", "level": 2, "title": "RecursiveCharacterTextSplitter: the default", "html": "<p>It tries separators in order and only cuts smaller when a piece is still too big:<\/p><div class=\"pipe\"><b style=\"animation-delay:0.00s\">\"\\n\\n\" paragraph<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">\"\\n\" line<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">\" \" word<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">\"\" character<\/b><\/div><pre><code>splitter = RecursiveCharacterTextSplitter(chunk_size=800, chunk_overlap=100)\nchunks = splitter.split_documents(pages)     # keeps page metadata!<\/code><\/pre><p>In the notebook text (456 characters, overlap 10): chunk_size 50 → 12 chunks, 100 → 6, 200 → 4, 500 → 1.<\/p>"}, {"type": "mcq", "q": "Which separator does the recursive splitter try first?", "opts": ["\"\\n\\n\" (paragraph)", "\" \" (space)", "\"\" (character)", "\".\" (full stop)"], "a": 0, "why": "Biggest natural unit first, so paragraphs stay together when they fit."}, {"type": "learn", "level": 3, "title": "Special splitters and good sizes", "html": "<ul><li><code>MarkdownHeaderTextSplitter<\/code> / <code>HTMLHeaderTextSplitter<\/code>: split by headings and keep them as metadata.<\/li><li><code>RecursiveCharacterTextSplitter.from_language(Language.PYTHON)<\/code>: keeps functions and classes together.<\/li><li><code>TokenTextSplitter<\/code>: exact token limits (tiktoken).<\/li><li><code>RecursiveJsonSplitter<\/code>: splits JSON by keys.<\/li><\/ul><p>Start with 500–1000 characters and 10–20% overlap, then test with real questions. Too small loses meaning; too big makes search noisy.<\/p>"}, {"type": "mcq", "q": "Split a Python codebase so each function stays together. Which line?", "opts": ["RecursiveCharacterTextSplitter.from_language(Language.PYTHON, chunk_size=800)", "CharacterTextSplitter(separator=\" \")", "RecursiveJsonSplitter(max_chunk_size=800)", "TokenTextSplitter(chunk_size=5)"], "a": 0, "why": "from_language uses code-aware separators like class and def.", "code": true}, {"type": "scenario", "story": "Your RAG bot answers “Report within 3 days” but users ask “3 days for what?”. You find chunks are only 60 characters long.", "q": "What should you change first?", "opts": ["Increase chunk_size (e.g. 500–1000) with some overlap", "Lower the temperature", "Use a bigger LLM", "Remove metadata"], "a": 0, "why": "Tiny chunks lose context. Bigger chunks keep the sentence and its subject together."}, {"type": "interview", "q": "How do you choose chunk size and overlap for a RAG system?", "answer": "<p>Start from the data: prose PDFs 500–1000 characters with 10–20% overlap; structured docs by headings; code by function. Respect the embedding model’s input limit. Then evaluate with real questions: measure whether the right chunk is retrieved (recall@k) and whether answers are complete, and tune. Keep metadata on every chunk for citations.<\/p>", "points": ["Depends on data type", "Typical 500–1000 chars, 10–20% overlap", "Respect model limits", "Evaluate retrieval and tune"]}, {"type": "interview", "q": "What is the difference between CharacterTextSplitter and RecursiveCharacterTextSplitter?", "answer": "<p>CharacterTextSplitter splits on one separator only, so a long paragraph can exceed the chunk size. The recursive splitter tries a list of separators (paragraph, line, space, character) and splits further only when needed, keeping natural units together. It is the recommended default.<\/p>", "points": ["Character: one separator", "Can produce oversized chunks", "Recursive: list of separators", "Recursive is the default choice"]}]}</script>
