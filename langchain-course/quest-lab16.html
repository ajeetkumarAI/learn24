<script type="application/json" id="quest-data">{"title": "Lab 16 Quest: LangChain Classic: Reading Old Code", "lesson": "lab16-langchain-classic.html", "next": "quest-lab17.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Old LangChain still exists, in langchain-classic", "html": "<div class=\"an\"><span>📒<\/span><div>Like your senior’s <b>old notes<\/b>: the ideas are right, but chapter names moved.<\/div><\/div><p>Most tutorials use LangChain 0.x: <code>LLMChain<\/code>, <code>ConversationChain<\/code>, <code>RetrievalQA<\/code>, <code>initialize_agent<\/code>. In v1 they live in <b>langchain-classic<\/b>, print deprecation warnings and are scheduled for removal in 2.0.<\/p><pre><code>from langchain_classic.chains import LLMChain       # old\nchain = prompt | llm | StrOutputParser()             # new<\/code><\/pre>"}, {"type": "mcq", "q": "What is the v1 replacement for <code>LLMChain(llm=llm, prompt=prompt)<\/code>?", "opts": ["prompt | llm | StrOutputParser()", "create_agent(prompt)", "ConversationChain(prompt)", "RetrievalQA(llm)"], "a": 0, "why": "An LCEL pipe does the same job."}, {"type": "learn", "level": 2, "title": "Old memory classes", "html": "<ul><li><code>ConversationBufferMemory<\/code>: everything.<\/li><li><code>ConversationBufferWindowMemory(k=1)<\/code>: only the last exchange.<\/li><li><code>ConversationSummaryMemory<\/code>: a running summary written by the LLM.<\/li><\/ul><p>Turn 1 “My name is Ajeet”, turn 2 “I like cricket”, turn 3 “What is my name?” → buffer remembers; window with k=1 forgets.<\/p>"}, {"type": "mcq", "q": "With ConversationBufferWindowMemory(k=1), what is remembered at turn 3?", "opts": ["Only the turn-2 exchange (“I like cricket”)", "All turns", "Nothing at all", "Only the system prompt"], "a": 0, "why": "k=1 keeps the last exchange, so the name from turn 1 is gone."}, {"type": "learn", "level": 3, "title": "Old → new map", "html": "<ul><li><code>SequentialChain<\/code> → <code>{\"x\": chain1} | chain2<\/code>, <code>RunnablePassthrough.assign<\/code><\/li><li><code>ConversationChain<\/code> → message history or agent + checkpointer<\/li><li><code>BufferWindowMemory<\/code> → <code>trim_messages<\/code><\/li><li><code>ConversationSummaryMemory<\/code> → <code>SummarizationMiddleware<\/code><\/li><li><code>RetrievalQA<\/code> → LCEL RAG chain<\/li><li><code>initialize_agent<\/code> / <code>AgentExecutor<\/code> → <code>create_agent<\/code><\/li><li><code>.run()<\/code>, <code>.predict()<\/code> → <code>.invoke()<\/code><\/li><\/ul>"}, {"type": "mcq", "q": "Convert <code>agent = initialize_agent(tools, llm, agent=\"zero-shot-react-description\")<\/code> to v1:", "opts": ["agent = create_agent(llm, tools)", "agent = LLMChain(llm, tools)", "agent = RetrievalQA(tools)", "agent = llm | tools"], "a": 0, "why": "create_agent replaces the old agent constructors.", "code": true}, {"type": "scenario", "story": "A team’s 2023 project uses <code>RetrievalQA<\/code>, <code>ConversationChain<\/code> and <code>.run()<\/code>. After upgrading to LangChain 1.x, imports fail.", "q": "What is the quickest safe path?", "opts": ["Install langchain-classic and fix imports now, then migrate piece by piece to LCEL / create_agent", "Delete the project", "Pin the old version forever without testing", "Rewrite everything in one night"], "a": 0, "why": "langchain-classic keeps old code running while you migrate gradually with tests."}, {"type": "interview", "q": "What changed in LangChain 1.0 compared to 0.x?", "answer": "<p>Agents are built with create_agent on top of LangGraph (with middleware for guardrails); legacy chains, memory classes and old agent constructors moved to langchain-classic; LCEL and .invoke() are the standard; memory for agents uses checkpointers; integrations live in provider packages (langchain-openai, langchain-groq…), and many community integrations are moving to their own packages.<\/p>", "points": ["create_agent + middleware", "Legacy → langchain-classic", "LCEL and invoke() standard", "Checkpointers and provider packages"]}, {"type": "interview", "q": "How would you migrate a legacy LangChain app safely?", "answer": "<p>Write tests on current behaviour first; switch imports to langchain-classic to get running; replace components one at a time (LLMChain → LCEL, RetrievalQA → LCEL RAG, agents → create_agent, memory → checkpointer); compare outputs with LangSmith traces and an evaluation set; remove classic dependencies at the end.<\/p>", "points": ["Tests / baseline first", "langchain-classic as a bridge", "Migrate component by component", "Compare with traces / evals"]}]}</script>
