<script type="application/json" id="quest-data">{"title": "Lab 06 Quest: Document Loaders", "lesson": "lab06-document-loaders.html", "next": "quest-lab07.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Every source becomes a Document", "html": "<div class=\"an\"><span>✉️<\/span><div>Like <b>India Post<\/b>: the content goes inside a standard envelope, the address is written outside.<\/div><\/div><pre><code>Document(page_content=&quot;Report a lost card within 3 days for zero liability.&quot;,\n         metadata={&quot;source&quot;: &quot;novabank_handbook.pdf&quot;, &quot;page&quot;: 0})<\/code><\/pre><p><code>page_content<\/code> is the text; <code>metadata<\/code> is the label (file, page, row). Loading is step 1 of every RAG app.<\/p>"}, {"type": "mcq", "q": "What are the two parts of a LangChain Document?", "opts": ["page_content and metadata", "prompt and answer", "vector and score", "title and body"], "a": 0, "why": "Metadata carries the source and page used for citations later."}, {"type": "learn", "level": 2, "title": "The right loader for each source", "html": "<ul><li><code>TextLoader<\/code>: one Document per .txt file.<\/li><li><code>CSVLoader<\/code>: one Document per <b>row<\/b>.<\/li><li><code>PyPDFLoader<\/code>: one Document per <b>page<\/b>.<\/li><li><code>JSONLoader(jq_schema=\".[].answer\")<\/code>: picks fields.<\/li><li><code>WebBaseLoader<\/code>, <code>WikipediaLoader<\/code>, <code>DirectoryLoader(glob=\"*.txt\")<\/code>.<\/li><\/ul>"}, {"type": "mcq", "q": "<code>PyPDFLoader(\"policy.pdf\").load()<\/code> on a 40-page PDF returns…", "opts": ["1 Document", "40 Documents, one per page", "40 vectors", "A string"], "a": 1, "why": "Each page becomes a Document with page metadata."}, {"type": "learn", "level": 3, "title": "Big data and the 2026 package change", "html": "<p><code>lazy_load()<\/code> returns documents one at a time, so a 5,000-page archive does not fill your memory.<\/p><pre><code>for page in PyPDFLoader(&quot;archive.pdf&quot;).lazy_load():\n    process(page)<\/code><\/pre><p><code>langchain-community<\/code> now warns that it is being <b>sunset<\/b>; many integrations move to their own packages (for example <code>langchain-chroma<\/code>). Prefer a dedicated package when one exists.<\/p>"}, {"type": "mcq", "q": "You must load 10,000 PDF pages on a laptop with little RAM. Which call?", "opts": ["loader.lazy_load()", "loader.load()", "loader.batch()", "loader.stream_all()"], "a": 0, "why": "lazy_load yields one Document at a time.", "code": true}, {"type": "scenario", "story": "A bank wants its chatbot to answer from 500 policy PDFs and show “Source: Loan Policy, page 12” under every answer.", "q": "What must you keep while loading?", "opts": ["The metadata (source and page) of every Document", "Only the text, to save space", "Only the first page", "The PDF images"], "a": 0, "why": "Citations come from metadata. Lose it and you cannot show sources."}, {"type": "interview", "q": "What is a Document in LangChain and why does metadata matter?", "answer": "<p>A Document is the standard unit of text: <code>page_content<\/code> plus a <code>metadata<\/code> dict. Every loader returns Documents, so splitters, embeddings and vector stores work the same for any source. Metadata such as source, page, date or department enables citations, filtering (only HR documents, only 2026) and access control.<\/p>", "points": ["page_content + metadata", "Standard format for all loaders", "Citations", "Filtering / access control"]}, {"type": "interview", "q": "How would you ingest a large, mixed document collection for RAG?", "answer": "<p>Use the right loader per type (PDF, DOCX, web, CSV) or DirectoryLoader per folder, stream with lazy_load, clean the text, keep and enrich metadata (source, page, date, owner), split into chunks, embed and store, ideally as an incremental pipeline that only re-processes changed files.<\/p>", "points": ["Right loader per type", "lazy_load for scale", "Rich metadata", "Incremental re-indexing"]}]}</script>
