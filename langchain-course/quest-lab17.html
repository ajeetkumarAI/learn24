<script type="application/json" id="quest-data">{"title": "Lab 17 Quest: LangGraph Basics: the Engine behind Agents", "lesson": "lab17-langgraph-basics.html", "next": null, "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "LangGraph: state flows through nodes", "html": "<div class=\"an\"><span>🚇<\/span><div>Like the <b>Mumbai Metro map<\/b>: stations are nodes, tracks are edges, an interchange is a conditional edge, and your bag (state) travels through every station.<\/div><\/div><pre><code>class State(TypedDict):\n    name: str\n    greeting: str\ndef say_hello(state): return {&quot;greeting&quot;: f&quot;Hello {state[&#x27;name&#x27;]}!&quot;}\nbuilder = StateGraph(State)\nbuilder.add_node(&quot;say_hello&quot;, say_hello)\nbuilder.add_edge(START, &quot;say_hello&quot;); builder.add_edge(&quot;say_hello&quot;, END)<\/code><\/pre><p>A node returns <b>updates<\/b> to the state; LangGraph merges them.<\/p>"}, {"type": "mcq", "q": "What does a LangGraph node return?", "opts": ["A dict of updates to the state", "A new graph", "An HTML page", "Nothing"], "a": 0, "why": "LangGraph merges each node’s updates into the shared state."}, {"type": "learn", "level": 2, "title": "Conditional edges route the flow", "html": "<pre><code>def route(state):\n    return &quot;passed&quot; if state[&quot;marks&quot;] &gt;= 35 else &quot;failed&quot;\nb.add_conditional_edges(&quot;check&quot;, route, {&quot;passed&quot;: &quot;passed&quot;, &quot;failed&quot;: &quot;failed&quot;})<\/code><\/pre><p>marks = 72 → passed → “🎉 Pass”. marks = 20 → failed → “📚 Fail, try again”.<\/p>"}, {"type": "mcq", "q": "marks = 34 with the route above. Which node runs after check?", "opts": ["failed", "passed", "END", "check again"], "a": 0, "why": "34 < 35, so route() returns \"failed\".", "hint": "Look at the >= sign."}, {"type": "learn", "level": 3, "title": "Build your own agent, with memory and approval", "html": "<pre><code>b.add_node(&quot;assistant&quot;, assistant)\nb.add_node(&quot;tools&quot;, ToolNode(tools))\nb.add_edge(START, &quot;assistant&quot;)\nb.add_conditional_edges(&quot;assistant&quot;, tools_condition)   # tool call? → tools, else END\nb.add_edge(&quot;tools&quot;, &quot;assistant&quot;)                        # loop back\ngraph = b.compile(checkpointer=InMemorySaver(), interrupt_before=[&quot;tools&quot;])<\/code><\/pre><p><code>get_state(cfg).next<\/code> → <code>('tools',)<\/code> while paused. Resume with <code>graph.invoke(None, cfg)<\/code>. This assistant ⇄ tools loop is the graph inside create_agent.<\/p>"}, {"type": "order", "q": "Order one turn of the custom agent graph for “What is 23 × 17?”:", "items": ["START", "assistant (LLM asks for multiply)", "tools_condition → tools", "tools node runs multiply → 391", "assistant writes the final answer", "END"], "why": "The loop ends when the assistant replies with no tool call."}, {"type": "scenario", "story": "A loan-approval flow must: check documents, score risk, and if the score is high, wait for a manager before sending the approval email.", "q": "What should you build?", "opts": ["A LangGraph workflow with conditional edges and an interrupt before the email node", "A single prompt", "A RetrievalQA chain", "A free-roaming agent with all tools"], "a": 0, "why": "Explicit steps, branching and human approval are exactly what LangGraph is for."}, {"type": "interview", "q": "When would you use LangGraph instead of create_agent or a chain?", "answer": "<p>Use a chain for fixed steps, create_agent for a standard tool-calling agent, and LangGraph when you need custom control: explicit steps, branches and loops, human approval at specific points, multi-agent coordination, durable state with checkpoints, time travel and streaming of intermediate steps.<\/p>", "points": ["Chain: fixed steps", "create_agent: standard agent", "LangGraph: custom branches/loops", "Human approval, multi-agent, durable state"]}, {"type": "interview", "q": "Explain state, nodes, edges and checkpointers in LangGraph.", "answer": "<p>State is a typed dict shared across the graph (with reducers deciding how updates merge, e.g. appending messages). Nodes are functions that read state and return updates. Edges decide the next node; conditional edges choose with a function. A checkpointer saves state after each step per thread_id, enabling memory, interrupts, resume and time travel.<\/p>", "points": ["State = shared typed dict (+ reducers)", "Nodes return updates", "Edges / conditional edges", "Checkpointer: memory, interrupt, resume"]}]}</script>
