<script type="application/json" id="quest-data">{"title": "Lab 12 Quest: Tools & Tool Calling", "lesson": "lab12-tools-tool-calling.html", "next": "quest-lab13.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Tools: the LLM asks, your code acts", "html": "<div class=\"an\"><span>🧑‍💼<\/span><div>The <b>manager<\/b> (LLM) writes a note “get balance of account 1234”; the <b>assistant<\/b> (your code) does it and brings back the answer.<\/div><\/div><div class=\"pipe\"><b style=\"animation-delay:0.00s\">User<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">LLM: “call get_weather(Pune)”<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">Your code runs it<\/b><em>→<\/em><b style=\"animation-delay:0.45s\">ToolMessage<\/b><em>→<\/em><b style=\"animation-delay:0.60s\">LLM answers<\/b><\/div><p>The LLM <b>never runs<\/b> the tool itself.<\/p>"}, {"type": "mcq", "q": "Who actually executes a tool?", "opts": ["Your code", "The LLM", "Groq’s servers", "The vector store"], "a": 0, "why": "The model only returns a tool-call request with arguments."}, {"type": "learn", "level": 2, "title": "@tool turns a function into a schema", "html": "<pre><code>@tool\ndef get_weather(city: str) -&gt; str:\n    &quot;&quot;&quot;Get the current weather of an Indian city.&quot;&quot;&quot;\n    ...<\/code><\/pre><p>The <b>name<\/b>, <b>docstring<\/b> and <b>type hints<\/b> become the schema the LLM reads. For strict validation, use <code>@tool(args_schema=EMIInput)<\/code> with a Pydantic model: “five lakh” as a principal is rejected.<\/p>"}, {"type": "mcq", "q": "What does the LLM read to decide <i>when<\/i> to use a tool?", "opts": ["The docstring / description", "The return value", "The file name", "The Python version"], "a": 0, "why": "Write docstrings that say when to use the tool."}, {"type": "learn", "level": 3, "title": "bind_tools and the loop", "html": "<pre><code>llm_with_tools = llm.bind_tools(tools)\nai = llm_with_tools.invoke(messages)\nfor c in ai.tool_calls:\n    result = tools_by_name[c[&quot;name&quot;]].invoke(c[&quot;args&quot;])\n    messages.append(ToolMessage(str(result), tool_call_id=c[&quot;id&quot;]))<\/code><\/pre><p>Repeat until the AI replies with no tool calls. This loop is exactly what an agent automates.<\/p>"}, {"type": "mcq", "q": "How do you send a tool’s result back to the model?", "opts": ["messages.append(ToolMessage(str(result), tool_call_id=call[\"id\"]))", "messages.append(SystemMessage(result))", "print(result)", "llm.bind_tools(result)"], "a": 0, "why": "The tool_call_id links each result to its request.", "code": true}, {"type": "scenario", "story": "An EMI tool sometimes crashes when the model passes <code>years=\"three\"<\/code>, and the whole chat fails.", "q": "What is the best tool design?", "opts": ["Typed args_schema plus error handling inside the tool that returns a helpful message", "Remove the docstring", "Let it crash", "Use temperature=1"], "a": 0, "why": "Validate inputs and return errors as text so the agent can recover."}, {"type": "interview", "q": "Explain tool calling (function calling) in LLMs.", "answer": "<p>You describe tools with a name, description and JSON schema. The model, when it needs one, returns a structured tool call (name + arguments) instead of text. Your application validates and executes it, then sends the result back as a tool message, and the model continues until it can answer. The model never executes code itself.<\/p>", "points": ["Tools described by name, description, schema", "Model returns structured call", "App executes and returns result", "Loop until final answer"]}, {"type": "interview", "q": "What makes a good tool for an LLM agent?", "answer": "<p>One clear job and a clear name; a docstring that says when to use it; typed, validated arguments; short text or JSON output; errors handled and returned as messages; idempotent and safe, with risky actions (payments, emails) behind human approval.<\/p>", "points": ["Single clear purpose and name", "Good description", "Typed, validated args", "Errors handled; risky actions approved"]}]}</script>
