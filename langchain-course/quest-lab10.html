<script type="application/json" id="quest-data">{"title": "Lab 10 Quest: Retrievers", "lesson": "lab10-retrievers.html", "next": "quest-lab11.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "A retriever: question in, documents out", "html": "<p>Every vector store becomes a retriever with one line, and a retriever is a Runnable, so it fits in chains:<\/p><pre><code>retriever = vector_store.as_retriever(search_kwargs={&quot;k&quot;: 2})\nretriever.invoke(&quot;my card is stolen&quot;)<\/code><\/pre><p>Options: <code>search_type=\"mmr\"<\/code> for diverse results; <code>\"similarity_score_threshold\"<\/code> to return nothing for unrelated questions like “pizza recipe”.<\/p>"}, {"type": "mcq", "q": "What does a retriever return?", "opts": ["A list of relevant Documents", "An AIMessage", "A vector", "A prompt template"], "a": 0, "why": "It is the “R” in RAG: it fetches documents for the LLM."}, {"type": "learn", "level": 2, "title": "Keyword vs meaning: hybrid search", "html": "<div class=\"an\"><span>🔎<\/span><div>Two librarians: one understands <b>meaning<\/b>, the other matches <b>exact words<\/b>. Ask both.<\/div><\/div><p><code>BM25Retriever<\/code> is keyword search: great for codes and IDs (“U30”, PAN, IFSC). Vector search is great for meaning. <code>EnsembleRetriever<\/code> merges both:<\/p><pre><code>hybrid = EnsembleRetriever(retrievers=[bm25, vector_retriever], weights=[0.5, 0.5])<\/code><\/pre><p>⚠️ Default BM25 splits on spaces, so “UPI-U30” is one word and “U30” misses. Fix: <code>preprocess_func=lambda t: re.findall(r\"\\w+\", t.lower())<\/code>.<\/p>"}, {"type": "mcq", "q": "Users search for exact error codes like “U30”. Which retriever helps most?", "opts": ["BM25 (keyword), ideally in a hybrid", "MMR only", "A bigger LLM", "No retriever"], "a": 0, "why": "Exact tokens need keyword search; hybrid keeps semantic search too."}, {"type": "learn", "level": 3, "title": "Smarter retrievers", "html": "<ul><li><b>MultiQueryRetriever<\/b>: the LLM rewrites a vague question 3 ways and merges results.<\/li><li><b>ContextualCompressionRetriever<\/b>: keeps only the useful sentences of long chunks.<\/li><li><b>ParentDocumentRetriever<\/b>: searches small chunks, returns the bigger parent for full context.<\/li><\/ul>"}, {"type": "mcq", "q": "Your chunks are small for precise search, but answers lack context. Which retriever?", "opts": ["ParentDocumentRetriever", "BM25Retriever", "score threshold", "StrOutputParser"], "a": 0, "why": "Search small, return the big parent section."}, {"type": "scenario", "story": "A bank chatbot gets short, vague questions like “send limit new?” and retrieves the wrong chunks.", "q": "What is a good fix?", "opts": ["MultiQueryRetriever to rewrite the question in several clear ways", "Increase chunk_overlap to 90%", "temperature=1", "Remove metadata"], "a": 0, "why": "Rewriting vague questions improves recall."}, {"type": "interview", "q": "What is hybrid search and why is it used in production RAG?", "answer": "<p>Hybrid search combines keyword search (BM25) and vector search, then merges rankings (for example with Reciprocal Rank Fusion). Keyword search catches exact terms like IDs, codes and names; vector search catches meaning and synonyms. Together they improve recall, which is why most production RAG systems use hybrid retrieval, often followed by a re-ranker.<\/p>", "points": ["BM25 + vector search", "Merge rankings (RRF / weights)", "Exact terms + meaning", "Often followed by re-ranking"]}, {"type": "interview", "q": "How do you evaluate and improve a retriever?", "answer": "<p>Build a test set of real questions with the chunks that should be found. Measure recall@k, MRR or hit rate. Then tune chunking, k, hybrid weights, add query rewriting or a re-ranker, and use metadata filters. Re-run the test after each change.<\/p>", "points": ["Test set of questions + expected chunks", "Metrics: recall@k / MRR", "Tune chunking, k, hybrid, re-ranking", "Re-test after every change"]}]}</script>
