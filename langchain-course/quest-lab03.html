<script type="application/json" id="quest-data">{"title": "Lab 03 Quest: Output Parsers & Structured Output", "lesson": "lab03-output-parsers.html", "next": "quest-lab04.html", "ranks": [[0, "🌱 Prompt Apprentice"], [150, "🔗 Chain Builder"], [450, "📚 RAG Ranger"], [800, "🤖 Agent Architect"], [1200, "🏆 LangChain Master"]], "stages": [{"type": "learn", "level": 1, "title": "Parsers turn text into data", "html": "<div class=\"an\"><span>🏦<\/span><div>Like a <b>bank clerk<\/b> who turns a customer’s story into exact form fields.<\/div><\/div><p>An LLM returns text. Your code needs a list, dict or object. A parser is the last step that converts it:<\/p><div class=\"pipe\"><b style=\"animation-delay:0.00s\">\"Python, Java, Go\"<\/b><em>→<\/em><b style=\"animation-delay:0.15s\">CommaSeparatedListOutputParser<\/b><em>→<\/em><b style=\"animation-delay:0.30s\">['Python', 'Java', 'Go']<\/b><\/div><p><code>StrOutputParser<\/code> simply turns an AIMessage into its text. It ends most chains.<\/p>"}, {"type": "mcq", "q": "Which parser turns <code>\"Python, Java, Go\"<\/code> into a Python list?", "opts": ["StrOutputParser", "CommaSeparatedListOutputParser", "XMLOutputParser", "JsonOutputParser"], "a": 1, "why": "It splits on commas and strips spaces."}, {"type": "learn", "level": 2, "title": "JSON and Pydantic: shape plus validation", "html": "<p><code>JsonOutputParser<\/code> gives a dict. <code>PydanticOutputParser<\/code> also <b>validates types<\/b>:<\/p><pre><code>class Smartphone(BaseModel):\n    name: str\n    price: int\n    features: list[str]\n\nparser = PydanticOutputParser(pydantic_object=Smartphone)\nprompt = f&quot;Describe a phone. {parser.get_format_instructions()}&quot;<\/code><\/pre><p>If the model writes <code>\"price\": \"eighty thousand\"<\/code>, parsing fails with an <b>OutputParserException<\/b> instead of saving bad data.<\/p>"}, {"type": "mcq", "q": "What does <code>parser.get_format_instructions()<\/code> give you?", "opts": ["Text to add to the prompt describing the exact output format", "The answer from the LLM", "A fixed JSON file", "The model’s token count"], "a": 0, "why": "The model reads these instructions; the parser checks the reply afterwards."}, {"type": "learn", "level": 3, "title": "with_structured_output: the modern way", "html": "<p>Modern models support tool calling / JSON mode. <code>llm.with_structured_output(Schema)<\/code> uses it, so the reply always fits your schema and comes back as an object:<\/p><pre><code>class TransactionRisk(BaseModel):\n    amount_inr: float\n    merchant: str\n    channel: Literal[&quot;UPI&quot;, &quot;card&quot;, &quot;netbanking&quot;, &quot;unknown&quot;]\n    risk_level: Literal[&quot;LOW&quot;, &quot;MEDIUM&quot;, &quot;HIGH&quot;]\n    reasons: list[str]\n\nresult = llm.with_structured_output(TransactionRisk).invoke(sms_text)\nif result.risk_level == &quot;HIGH&quot;: block_payment()<\/code><\/pre><p><code>Literal<\/code> limits values to exact choices. <code>OutputFixingParser<\/code> can repair broken output with a second LLM call.<\/p>"}, {"type": "mcq", "q": "Which line returns a validated <code>TransactionRisk<\/code> object directly?", "opts": ["llm.with_structured_output(TransactionRisk).invoke(text)", "StrOutputParser().invoke(TransactionRisk)", "llm.invoke(text).json()", "TransactionRisk(llm)"], "a": 0, "why": "with_structured_output binds the schema and parses the tool call into the Pydantic object.", "code": true}, {"type": "scenario", "story": "Your fraud dashboard sometimes crashes because the model writes risk levels like “High risk”, “high” and “HIGH!!”.", "q": "What is the best fix?", "opts": ["Use with_structured_output with <code>risk_level: Literal[\"LOW\",\"MEDIUM\",\"HIGH\"]<\/code>", "Ask the model nicely to use capitals", "Lower max_tokens", "Use stream()"], "a": 0, "why": "A Literal type restricts values, and structured output enforces it through tool calling."}, {"type": "interview", "q": "Compare PydanticOutputParser and with_structured_output. When would you use each?", "answer": "<p>PydanticOutputParser adds format instructions to the prompt and parses the text reply. It works with any model, even without tool calling, but the model can still produce bad output. <code>with_structured_output<\/code> uses the model’s native tool calling or JSON mode, so output is far more reliable. Use with_structured_output on modern models; use the parser (with OutputFixingParser as a fallback) for models without tool calling.<\/p>", "points": ["Parser = format instructions + parse text", "Works with any model", "with_structured_output = native tool calling / JSON mode", "Choose based on model support / reliability"]}, {"type": "interview", "q": "How do you handle an LLM returning invalid JSON in production?", "answer": "<p>Prevent it first with structured output and strict schemas. Then validate with Pydantic; on failure, retry with the error message (OutputFixingParser / retry parser) a limited number of times, log the failure, and fall back to a safe default or human review instead of crashing.<\/p>", "points": ["Structured output / schema first", "Validate with Pydantic", "Limited retry with error feedback", "Log and fall back safely"]}]}</script>
