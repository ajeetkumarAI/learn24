<script>window.LESSON = {
 "eyebrow": "AI System Design · Case study",
 "title": "Design a RAG Chatbot",
 "color": "#f2b84b",
 "lede": "An interview-style design for NovaBank’s internal policy assistant: requirements, ingestion, query path, latency budget, evaluation and monitoring.",
 "steps": [
  {
   "t": "Requirements",
   "s": "Agree the numbers before drawing boxes.",
   "b": [
    {
     "type": "cards",
     "items": [
      [
       "Users",
       "5,000 employees, ~200 concurrent at peak"
      ],
      [
       "Corpus",
       "40,000 PDFs and wiki pages, updated daily"
      ],
      [
       "Latency",
       "first token < 1.5 s, full answer p95 < 4 s"
      ],
      [
       "Must have",
       "citations, access control, audit log"
      ]
     ]
    }
   ]
  },
  {
   "t": "Ingestion pipeline (offline)",
   "s": "Runs on a schedule and on every document change.",
   "b": [
    {
     "type": "flow",
     "nodes": [
      [
       "Sources",
       "SharePoint, wiki"
      ],
      [
       "Parse + clean",
       "PDF → text"
      ],
      [
       "Chunk",
       "500 tokens"
      ],
      [
       "Embed",
       "batch"
      ],
      [
       "Vector + keyword index",
       "with ACL tags"
      ]
     ],
     "hot": [
      4
     ]
    }
   ]
  },
  {
   "t": "Query path (online)",
   "s": "What happens on each question.",
   "b": [
    {
     "type": "flow",
     "nodes": [
      [
       "User"
      ],
      [
       "Auth + ACL"
      ],
      [
       "Rewrite query"
      ],
      [
       "Hybrid search",
       "vector + BM25"
      ],
      [
       "Re-rank",
       "top 5"
      ],
      [
       "LLM",
       "stream"
      ],
      [
       "Answer + citations"
      ]
     ],
     "hot": [
      3,
      4,
      5
     ]
    }
   ]
  },
  {
   "t": "Latency budget",
   "s": "Where the 4 seconds go (p95).",
   "b": [
    {
     "type": "bars",
     "rows": [
      [
       "Auth + rewrite",
       250,
       "250 ms"
      ],
      [
       "Hybrid search",
       120,
       "120 ms"
      ],
      [
       "Re-rank",
       180,
       "180 ms"
      ],
      [
       "LLM first token",
       700,
       "700 ms",
       "top"
      ],
      [
       "LLM full answer",
       2400,
       "2.4 s",
       "top"
      ]
     ],
     "max": 2400
    },
    {
     "type": "note",
     "text": "Streaming hides most of the generation time: users see text after about <b>1.25 s</b>."
    }
   ]
  },
  {
   "t": "Scale and cost",
   "s": "",
   "b": [
    {
     "type": "list",
     "items": [
      [
       "Semantic cache",
       "serve repeated questions without calling the LLM"
      ],
      [
       "Small model first",
       "route easy questions to a cheaper model"
      ],
      [
       "Incremental indexing",
       "re-embed only changed documents"
      ],
      [
       "Stateless API pods",
       "autoscale on concurrent requests"
      ]
     ]
    }
   ]
  },
  {
   "t": "Evaluate before launch",
   "s": "A golden set of 300 real questions with known answers.",
   "b": [
    {
     "type": "bars",
     "rows": [
      [
       "Retrieval recall@5",
       0.92,
       "0.92",
       "top"
      ],
      [
       "Faithfulness",
       0.95,
       "0.95",
       "top"
      ],
      [
       "Answer relevance",
       0.89,
       "0.89"
      ],
      [
       "Citation accuracy",
       0.97,
       "0.97",
       "top"
      ]
     ],
     "max": 1
    }
   ]
  },
  {
   "t": "Monitor in production",
   "s": "Dashboards and alerts.",
   "b": [
    {
     "type": "cards",
     "items": [
      [
       "Quality",
       "thumbs down rate, \"I don’t know\" rate"
      ],
      [
       "Latency",
       "TTFT and p95 per stage"
      ],
      [
       "Cost",
       "₹ per 1,000 questions, cache hit rate"
      ],
      [
       "Safety",
       "ACL denials, PII detections, injection flags"
      ]
     ]
    }
   ]
  }
 ],
 "takeaways": [
  [
   "Start from requirements and numbers",
   "users, corpus, latency, must-haves"
  ],
  [
   "Hybrid search + re-ranking beats vectors alone",
   "for policy and jargon-heavy text"
  ],
  [
   "Access control at retrieval time",
   "never rely on the prompt"
  ],
  [
   "Evaluate offline, monitor online",
   "with the same metrics"
  ]
 ],
 "fine": "Figures are illustrative design targets."
};</script>
