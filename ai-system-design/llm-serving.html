<script>window.LESSON = {

  {
   "t": "Two phases per request",

    {
     "type": "flow",
     "nodes": [
      [
       "Prompt",
       "1,200 tokens"
      ],
      [
       "Prefill",
       "parallel, compute-bound"
      ],
      [
       "Decode",
       "token by token, memory-bound"
      ],
      [
       "Response",
       "300 tokens"
      ]
     ],
     "hot": [
      1,
      2
     ]
    },
    {
     "type": "cards",
     "items": [
      [
       "TTFT",
       "time to first token: set by prefill + queueing"
      ],
      [
       "TPOT",
       "time per output token: set by decode speed"
      ],
      [
       "Throughput",
       "tokens per second across all users"
      ]
     ]
    }
   ]
  },
  {
   "t": "KV cache",
   "s": "Keys and values for earlier tokens are stored so each decode step only computes the newest token.",

    {
     "type": "note",
     "text": "Without a cache, step 300 would recompute all 1,500 tokens. The cache grows with context length, so it is usually what fills GPU memory. <b>PagedAttention</b> stores it in pages to avoid waste."
    }
   ]
  },
  {
   "t": "Continuous batching",
   "s": "Static batching waits for the slowest request; continuous batching adds and removes requests every step.",
   "b": [
    {
     "type": "bars",
     "rows": [
      [

   ]

   "t": "Quantization",

     "type": "table",
     "head": [
      "Precision",
      "7B model weights",
      "Quality impact"
     ],
     "rows": [

       "~14 GB",
       "baseline"
      ],
      [
       "INT8",
       "~7 GB",
       "usually negligible"
      ],
      [
       "INT4 (AWQ, GPTQ)",
       "~3.5–4 GB",
       "small; test on your tasks"
      ]
     ]
    }
   ]
  },
  {
   "t": "Route and autoscale",
   "s": "Put a router in front of several model replicas.",

     "type": "flow",
     "nodes": [
      [
       "Requests"

       "Router",
       "queue + priority"

      ],
      [
       "Replica 2",
       "A100"

       "not just CPU"

   ]

     "text": "Illustrative numbers for one replica under load."

   ]
  }
 ],
 "takeaways": [

   "Prefill sets TTFT, decode sets TPOT",
   "tune them separately"
  ],
  [
   "KV cache is the memory bottleneck",

  [
   "Continuous batching keeps GPUs busy",

  [

  ]
 ],
