<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How an LLM Is Trained · Learn24</title>
<meta name="description" content="Pretraining, SFT and RLHF animated step by step.">
<meta property="og:title" content="How an LLM Is Trained · Learn24">
<meta property="og:description" content="Pretraining, SFT and RLHF animated step by step.">
<meta name="theme-color" content="#0d1526">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%237cb4ff%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22monospace%22 font-size=%2215%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%230b111c%22%3E24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
<style>
/* Layout: one centered column like the inference animation. Pipeline tabs on top, numbered stages that light up in sequence. */
:root{
  --bg:#0d1526; --panel:#16223a; --panel2:#1c2a45; --line:#2a3b58; --fg:#e8eef8; --muted:#8a99b2; --dim:#55637c;
  --blue:#5aa9ff; --amber:#f2b84b; --green:#4fd1a1; --warn:#ff7a6b;
  --accent:#5aa9ff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --d:.45s;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
body[data-tab="sft"]{--accent:var(--amber)}
body[data-tab="rlhf"]{--accent:var(--green)}
.wrap{max-width:820px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px);font-weight:700;text-align:center;text-wrap:balance}
.lede{margin:0 0 18px;text-align:center;color:var(--muted);font-size:14px}

/* pipeline tabs */
.pipe{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pipe .arrow{align-self:center;color:var(--dim);font-size:18px}
.tab{flex:1 1 180px;max-width:250px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:inherit;cursor:pointer;transition:border-color var(--d),background var(--d)}
.tab:hover{border-color:var(--dim)}
.tab:focus-visible,.ctl button:focus-visible,.nextbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tab .n{display:block;font-weight:600;font-size:16px}
.tab .d{display:block;font-size:12.5px;color:var(--muted)}
.tab[data-k="pretraining"]{--c:var(--blue)} .tab[data-k="sft"]{--c:var(--amber)} .tab[data-k="rlhf"]{--c:var(--green)}
.tab .k::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--panel2);box-shadow:0 0 0 1px var(--c) inset}

/* controls */
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.ctl button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:500 13px var(--sans);padding:6px 12px;border-radius:8px;cursor:pointer}
.ctl button:hover{border-color:var(--dim)}
.ctl .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ctl .seg button{border:0;border-radius:0}
.ctl .seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}

/* stages */
.panel{border:1.5px solid var(--line);border-radius:14px;padding:4px 16px 14px;margin-top:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0 6px;opacity:.38;transition:opacity var(--d)}
.step.on,.step.done{opacity:1}
.num{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:13px;margin-top:1px;transition:background var(--d),color var(--d)}
.step.on .num{background:var(--accent);color:var(--bg)}
.step.done .num{background:var(--panel2);color:var(--accent)}
.step h3{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.step .sub{margin:1px 0 10px;color:var(--muted);font-size:13.5px;max-width:65ch}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}

.rv{opacity:0;transform:translateY(6px);transition:opacity var(--d),transform var(--d)}
.rv.show{opacity:1;transform:none}

.chip{font-family:var(--mono);font-size:13px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);white-space:pre;display:inline-block;transition:background var(--d),border-color var(--d),color var(--d),opacity var(--d)}
.chip.tgt{border-color:var(--accent);color:var(--accent)}
.chip.sp{color:var(--muted)}
.cap{font-size:13px;color:var(--muted)}
.cap b,.acc{color:var(--accent)}
.mono{font-family:var(--mono)}

.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.doc .src{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.doc pre{margin:4px 0 0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--fg);line-height:1.45}
.stat{font-size:13.5px;color:var(--muted)} .stat b{font-family:var(--mono);color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}

.tokrow{display:flex;flex-wrap:wrap;gap:8px}
.tk{display:flex;flex-direction:column;align-items:center;gap:3px}
.tid{font-family:var(--mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}

.pairs{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.pair,.plab{display:flex;flex-direction:column;align-items:center;gap:2px}
.plab span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);height:27px;display:flex;align-items:center}
.plab span.a{height:18px}
.arr{color:var(--dim);font-size:13px;line-height:18px}

.net{width:100%;max-width:620px;height:auto;display:block}
.net .e{stroke:var(--line);stroke-width:.7;transition:stroke var(--d),opacity var(--d);opacity:.7}
.net .n{fill:var(--panel2);stroke:var(--dim);stroke-width:1.2;transition:fill var(--d),stroke var(--d)}
.net .e.fwd{stroke:var(--accent);opacity:.55}
.net .n.fwd{fill:var(--accent);stroke:var(--accent)}
.net .e.back{stroke:var(--warn);opacity:.55}
.net .n.back{fill:var(--warn);stroke:var(--warn)}
.net text{fill:var(--muted);font-family:var(--mono);font-size:12px}
.net text.ax{font-family:var(--sans);font-size:11.5px;fill:var(--dim)}
.netwrap{overflow-x:auto}

.bars{display:flex;flex-direction:column;gap:6px;max-width:520px}
.bar{display:grid;grid-template-columns:88px minmax(0,1fr) 52px;gap:10px;align-items:center}
.bar .l{font-family:var(--mono);font-size:13px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:6px;transition:width calc(var(--d)*1.6) ease}
.rv.show .fill,.fill.go{width:var(--w)}
.bar.top .l{color:var(--accent)}
.bar .v{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.top .v{color:var(--fg)}
.fill.dim{background:var(--dim)}

.dv .track{overflow:visible;background:var(--panel2)}
.dv .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.dv .fill{inset:0 auto 0 50%;border-radius:0 6px 6px 0;background:var(--green)}
.dv .fill.neg{inset:0 50% 0 auto;border-radius:6px 0 0 6px;background:var(--warn)}

.loss{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:520px}
.lrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.lrow.big{font-size:17px;font-family:var(--mono)}
.ptable{border-collapse:collapse;font-size:13px;max-width:520px}
.ptable td{padding:4px 14px 4px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.ptable td.mono{color:var(--fg)}
.ptable tr.hl td{color:var(--accent)}

.curve{width:100%;max-width:560px;height:auto;display:block}
.curve .axl{stroke:var(--line);stroke-width:1}
.curve text{fill:var(--dim);font-size:11.5px;font-family:var(--sans)}
.curve .cl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.curve .cl.draw{stroke-dashoffset:0;transition:stroke-dashoffset calc(var(--d)*6) linear}

.io{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.txt{font-family:var(--mono);font-size:14px;white-space:pre-wrap;min-height:1.5em}
.prompt{color:var(--fg)}
.resp{color:var(--accent)}
.typing::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.verdict{font-size:13.5px;font-weight:500}
.verdict.bad{color:var(--warn)} .verdict.good{color:var(--green)}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;max-width:65ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color var(--d),opacity var(--d)}
.card .q{font-size:13.5px;font-weight:500}
.card .a{font-family:var(--mono);font-size:12.5px;color:var(--accent);white-space:pre-wrap}
.card .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card.pick{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.card.lose{opacity:.45}
.badge{font-family:var(--sans);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--green);color:var(--bg);letter-spacing:.04em;opacity:0;transition:opacity var(--d)}
.card.pick .badge{opacity:1}

.tmpl{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.tmpl .sp{color:var(--accent)}
.tmpl div{white-space:pre-wrap}
.card .q{white-space:pre-wrap}

.mask{display:flex;flex-wrap:wrap;gap:6px}
.chip.masked{opacity:.4;text-decoration:line-through;text-decoration-color:var(--dim)}
.chip.counted{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

.params{display:flex;flex-wrap:wrap;gap:8px}
.param{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.param b{color:var(--fg);font-weight:500}

.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px}
.box.rm{border-color:var(--accent);color:var(--accent);font-weight:600}
.formula{font-family:var(--mono);font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:inline-block;overflow-x:auto;max-width:100%}

.kl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;max-width:520px;font-size:13px;color:var(--muted)}
.kl .fill{background:var(--amber)}

.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--green);color:var(--green)}

.foot{text-align:center;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.loopline{font-size:14px;color:var(--fg)}
.credit{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 14px}.credit b{color:var(--accent);font-weight:600}
.fine{font-size:11.5px;color:var(--dim)}
.nextbtn{background:var(--accent);color:var(--bg);border:0;font:600 13.5px var(--sans);padding:8px 16px;border-radius:8px;cursor:pointer}

@media (max-width:560px){
  .docs{grid-template-columns:1fr}
  .bar{grid-template-columns:72px minmax(0,1fr) 46px}
  .step h3{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){
  .typing::after{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>How an LLM is trained</h1>
  <p class="lede">Three stages turn random weights into a helpful assistant. Pick a stage to watch it step by step.</p>

  <nav class="pipe" role="tablist" aria-label="Training stages">
    <button class="tab" role="tab" id="tab-pretraining" data-k="pretraining"><span class="k">Stage 1</span><span class="n">Pretraining</span><span class="d">Learn language from raw text</span></button>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="tab" role="tab" id="tab-sft" data-k="sft"><span class="k">Stage 2</span><span class="n">SFT</span><span class="d">Learn to follow instructions</span></button>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="tab" role="tab" id="tab-rlhf" data-k="rlhf"><span class="k">Stage 3</span><span class="n">RLHF</span><span class="d">Learn what people prefer</span></button>
  </nav>

  <div class="ctl">
    <button id="btn-pause" type="button">❚❚ Pause</button>
    <button id="btn-restart" type="button">↺ Restart</button>
    <div class="seg" role="group" aria-label="Speed">
      <button type="button" id="sp-05" data-s="0.5">0.5×</button>
      <button type="button" id="sp-1" data-s="1" aria-pressed="true">1×</button>
      <button type="button" id="sp-2" data-s="2">2×</button>
    </div>
  </div>

  <div class="panel" id="panel"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

let runId=0, paused=false, speed=1;
class Abort extends Error{}
function setSpeed(s){speed=s;document.documentElement.style.setProperty('--d',(reduce?0.05:0.45/s)+'s');
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===s)));}
async function wait(ms){
  const id=runId; let t=0; const eff=reduce?ms/10:ms;
  while(t<eff){ if(id!==runId) throw new Abort(); await new Promise(r=>setTimeout(r,16)); if(!paused) t+=16*speed; }
  if(id!==runId) throw new Abort();
}
async function showAll(st,sel,gap=220){for(const el of $$(sel,st)){el.classList.add('show');await wait(gap);}}
const show=(st,sel)=>$$(sel,st).forEach(e=>e.classList.add('show'));
async function type(el,text,cps=45){el.textContent='';el.classList.add('typing');for(const ch of text){el.textContent+=ch;await wait(1000/cps);}el.classList.remove('typing');}
async function count(el,to,suf){for(let v=0;v<=to;v++){el.textContent=v+suf;await wait(70);}}

/* ---------- drawing helpers ---------- */
function net(labels,outs=4){
  const W=620,H=Math.max(labels.length,5)*26+44, top=10, avail=H-40;
  const cols=[[140,labels.length],[260,5],[370,5],[480,5],[580,outs]];
  const ys=n=>Array.from({length:n},(_,i)=>top+(avail-(n-1)*26)/2+i*26+4);
  let e='',n='',t='';
  cols.forEach(([x,c],k)=>{
    const Y=ys(c);
    if(k>0){const [px,pc]=cols[k-1];ys(pc).forEach(py=>Y.forEach(y=>e+=`<line class="e c${k}" x1="${px}" y1="${py}" x2="${x}" y2="${y}"/>`));}
    Y.forEach(y=>n+=`<circle class="n c${k}" cx="${x}" cy="${y}" r="7"/>`);
  });
  ys(labels.length).forEach((y,i)=>t+=`<text x="124" y="${y+4}" text-anchor="end">${esc(labels[i])}</text>`);
  ['Embeddings','Layer 1','Layer 2','Layer N','Scores'].forEach((s,i)=>t+=`<text class="ax" x="${cols[i][0]}" y="${H-8}" text-anchor="middle">${s}</text>`);
  return `<div class="netwrap"><svg class="net" viewBox="0 0 ${W} ${H}" role="img" aria-label="Transformer network">${e}${n}${t}</svg></div>`;
}
async function light(st,order,cls){const svg=$('.net',st);for(const k of order){$$('.c'+k,svg).forEach(x=>x.classList.add(cls));await wait(380);}}
function curve(seed,start,end,label='loss'){
  const W=560,H=150,x0=40,x1=W-12,y0=H-26,y1=12;let r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const pts=[];for(let i=0;i<=70;i++){const L=end+(start-end)*Math.exp(-i/13)+(rnd()-.5)*0.28*start*(1-i/95);
    pts.push(`${(x0+i/70*(x1-x0)).toFixed(1)},${(y0-Math.max(0,L)/start*(y0-y1)*0.95).toFixed(1)}`);}
  return `<svg class="curve rv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Loss going down over training"><line class="axl" x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}"/><line class="axl" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/><text x="${x0-6}" y="${y1+8}" text-anchor="end">${label}</text><text x="${x1}" y="${H-6}" text-anchor="end">training steps →</text><polyline class="cl" pathLength="1" points="${pts.join(' ')}"/></svg>`;
}
async function drawCurve(st){const c=$('.curve',st);c.classList.add('show');await wait(100);$('.cl',c).classList.add('draw');await wait(2700);}
const bars=rows=>`<div class="bars">${rows.map(([l,p,top])=>`<div class="bar rv${top?' top':''}"><span class="l">${esc(l)}</span><div class="track"><div class="fill" style="--w:${p*100}%"></div></div><span class="v">${p.toFixed(2)}</span></div>`).join('')}</div>`;
const dvbars=rows=>`<div class="bars dv">${rows.map(([l,v])=>`<div class="bar rv"><span class="l">${esc(l)}</span><div class="track"><div class="fill${v<0?' neg':''}" style="--w:${Math.abs(v)/2.5*50}%"></div></div><span class="v">${v>0?'+':''}${v.toFixed(1)}</span></div>`).join('')}</div>`;
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;

const TOK=[['New',3648],[' Delhi',21996],[' is',374],[' the',279],[' capital',6864],[' of',315],[' India',6890],['.',13]];
const NETIN=['New','Delhi','is','the','capital','of'];
const ASK='What is the capital of India?';
const KYC=ASK;

/* ---------- STAGE 1: PRETRAINING ---------- */
const PRE={key:'pretraining',
 loop:'↻ Repeat over trillions of tokens and millions of update steps',
 next:['sft','Next: SFT →'],
 steps:[
 {t:'Collect a huge pile of text',s:'Web pages, books, code and papers, cleaned and deduplicated. No human labels needed: the text is its own answer key.',
  h:()=>`<div class="docs">${[['Web','New Delhi is the capital of India and home to Parliament, the Supreme Court and…'],['Code','def mean(xs):\n    return sum(xs) / len(xs)'],['Books','It was a bright cold day in April, and the clocks were striking…']].map(([k,v])=>`<div class="doc rv"><span class="src">${k}</span><pre>${esc(v)}</pre></div>`).join('')}</div><div class="stat rv">Training corpus: <b class="ctr">0T</b> tokens</div>`,
  r:async st=>{await showAll(st,'.doc',380);$('.stat',st).classList.add('show');await count($('.ctr',st),15,'T');}},
 {t:'Tokenize the text',s:'Every sentence becomes a sequence of token IDs, exactly as at inference time.',
  h:()=>`<div class="tokrow">${TOK.map(([w,id])=>`<div class="tk rv">${chip(w)}<span class="tid">${id}</span></div>`).join('')}</div>`,
  r:async st=>showAll(st,'.tk',200)},
 {t:'Shift by one: every token is a quiz',s:'The input is the sequence; the target is the same sequence moved one step left.',
  h:()=>`<div class="pairs"><div class="plab"><span>input</span><span class="a"></span><span>target</span></div>${TOK.slice(0,7).map(([w],i)=>`<div class="pair rv">${chip(w)}<span class="arr">↓</span>${chip(TOK[i+1][0],'tgt')}</div>`).join('')}</div><div class="cap rv">One 8-token sentence gives <b>7</b> “guess the next token” questions, all answered in parallel.</div>`,
  r:async st=>{await showAll(st,'.pair',240);show(st,'.cap');}},
 {t:'Transformer makes a guess',s:'Zooming in on one position: after “New Delhi is the capital of”, the model scores every token in its vocabulary.',
  h:()=>net(NETIN)+bars([[' India',.31,1],[' Delhi',.12],[' the',.09],[' Asia',.05]]),
  r:async st=>{await light(st,[0,1,2,3,4],'fwd');await showAll(st,'.bar',200);}},
 {t:'Measure the loss',s:'Cross-entropy loss: how surprised was the model by the real next token?',
  h:()=>`<div class="loss"><div class="lrow rv">Real next token ${chip(' India','tgt')}</div><div class="lrow rv">Probability the model gave it <b class="mono">p = 0.31</b></div><div class="lrow big rv">loss = −ln(0.31) = <b class="acc">1.17</b></div></div>
   <table class="ptable rv"><tr><td>p = 0.90</td><td class="mono">loss 0.11</td><td>confident and right</td></tr><tr class="hl"><td>p = 0.31</td><td class="mono">loss 1.17</td><td>our guess</td></tr><tr><td>p = 0.01</td><td class="mono">loss 4.61</td><td>very surprised</td></tr></table>`,
  r:async st=>{await showAll(st,'.lrow',500);show(st,'.ptable');}},
 {t:'Backpropagate and update the weights',s:'Gradients flow backward and nudge every weight so the real token gets a little more probability next time.',
  h:()=>net(NETIN)+`<div class="bars"><div class="bar top rv" id="pupd"><span class="l"> India</span><div class="track"><div class="fill" style="--w:31%"></div></div><span class="v">0.31</span></div></div>`+curve(7,4.2,1.6),
  r:async st=>{await light(st,[4,3,2,1,0],'back');const b=$('#pupd',st);b.classList.add('show');await wait(700);
    $('.fill',b).style.setProperty('--w','36%');$('.v',b).textContent='0.36';await wait(900);await drawCurve(st);}},
 {t:'Result: a base model',s:'It has absorbed grammar, facts and patterns, but it only knows how to continue documents.',
  h:()=>`<div class="io rv"><span class="who">Prompt</span><div class="txt prompt">${esc(ASK)}</div><span class="who">Base model continues</span><div class="txt resp"></div></div><div class="verdict bad rv">✕ Keeps writing a quiz page instead of answering</div>`,
  r:async st=>{show(st,'.io');await wait(300);await type($('.resp',st),'What is the capital of Nepal?\nWhat is the capital of Japan?\nAnswers are on page 12.');show(st,'.verdict');}},
 ]};

/* ---------- STAGE 2: SFT ---------- */
const MASKP=['<|user|>','What',' is',' the',' capital',' of',' India','?','<|assistant|>'];
const MASKR=['The',' capital',' of',' India',' is',' New',' Delhi','.','<|end|>'];
const SFT_ANS='The capital of India is New Delhi.';
const SFT={key:'sft',
 loop:'↻ A few passes over the demonstration set, starting from the base model weights',
 next:['rlhf','Next: RLHF →'],
 steps:[
 {t:'Start from the base model',s:'Pretraining gave it knowledge. Now it needs to learn the shape of a helpful reply.',
  h:()=>`<div class="io rv"><span class="who">Prompt</span><div class="txt prompt">${esc(ASK)}</div><span class="who">Base model</span><div class="txt resp"></div></div><div class="verdict bad rv">✕ Continues the text instead of answering</div>`,
  r:async st=>{show(st,'.io');await wait(300);await type($('.resp',st),'What is the capital of Nepal? What is…',60);show(st,'.verdict');}},
 {t:'Collect demonstrations',s:'People write the ideal answer to many kinds of prompts. Each pair is a worked example.',
  h:()=>`<div class="cards">${[['What is the capital of India?','The capital of India is New Delhi.'],['Summarize this log in one line:\nConnectionResetError at db.py:42 (x37)','The app lost its database connection 37 times at db.py, line 42.'],['Write a polite reminder for an unpaid invoice.','Hi Rohan, a gentle reminder that invoice #1042 was due on 20 Oct. Could you share a payment date?']].map(([q,a])=>`<div class="card rv"><span class="tag"><span>Prompt</span></span><span class="q">${esc(q)}</span><span class="tag"><span>Ideal response</span></span><span class="a">${esc(a)}</span></div>`).join('')}</div><div class="stat rv">Typically <b>10k–100k</b> high-quality examples</div>`,
  r:async st=>{await showAll(st,'.card',450);show(st,'.stat');}},
 {t:'Wrap each pair in a chat template',s:'Special tokens mark who is speaking. The model learns this conversation format.',
  h:()=>`<div class="tmpl"><div class="rv"><span class="sp">&lt;|system|&gt;</span> You are a helpful assistant.</div><div class="rv"><span class="sp">&lt;|user|&gt;</span> What is the capital of India?</div><div class="rv"><span class="sp">&lt;|assistant|&gt;</span> The capital of India is New Delhi.<span class="sp">&lt;|end|&gt;</span></div></div>`,
  r:async st=>showAll(st,'.tmpl > div',500)},
 {t:'Mask the prompt, learn only the response',s:'Same next-token loss as pretraining, but it only counts on the assistant’s tokens.',
  h:()=>`<div class="mask">${MASKP.map(t=>chip(t,'p'+(t.startsWith('<')?' sp':''))).join('')}${MASKR.map(t=>chip(t,'r'+(t.startsWith('<')?' sp':''))).join('')}</div><div class="legend rv"><span>${chip('abc','masked')} prompt: loss ignored</span><span>${chip('abc','counted')} response: loss counted</span></div>`,
  r:async st=>{await wait(300);for(const c of $$('.chip.p',st)){c.classList.add('masked');await wait(110);}for(const c of $$('.chip.r',st)){c.classList.add('counted');await wait(140);}show(st,'.legend');}},
 {t:'Fine-tune gently',s:'Small learning rate, few epochs, so the model keeps its knowledge while picking up the format.',
  h:()=>`<div class="params">${[['learning rate','~1e-5'],['epochs','2–3'],['init','base model weights'],['loss','next-token, response only']].map(([k,v])=>`<span class="param rv">${k} <b>${v}</b></span>`).join('')}</div>`+curve(3,2.4,0.9),
  r:async st=>{await showAll(st,'.param',200);await drawCurve(st);}},
 {t:'Result: an instruction-following model',s:'Same prompt, now answered in the assistant role.',
  h:()=>`<div class="io rv"><span class="who">Prompt</span><div class="txt prompt">${esc(ASK)}</div><span class="who">SFT model</span><div class="txt resp"></div></div><div class="verdict good rv">✓ Answers directly, in the chat format</div><div class="note rv">SFT copies examples. It can’t tell which of two reasonable answers people would prefer. RLHF adds that signal.</div>`,
  r:async st=>{show(st,'.io');await wait(300);await type($('.resp',st),SFT_ANS,70);await showAll(st,'.verdict, .note',500);}},
 ]};

/* ---------- STAGE 3: RLHF ---------- */
const SKY_A='The capital of India is New Delhi. The capital moved from Calcutta (Kolkata) in 1911, and New Delhi was inaugurated in 1931.';
const SKY_B='The capital of India is Mumbai.';
const RL={key:'rlhf',
 loop:'↻ Generate → score → update, for many iterations',
 next:['pretraining','Start over from Pretraining'],
 steps:[
 {t:'The SFT model writes several answers',s:'For one prompt, sample two or more different responses.',
  h:()=>`<div class="io rv"><span class="who">Prompt</span><div class="txt prompt">${esc(KYC)}</div></div><div class="cards"><div class="card rv"><span class="tag"><span>Answer A</span></span><span class="a ta"></span></div><div class="card rv"><span class="tag"><span>Answer B</span></span><span class="a tb"></span></div></div>`,
  r:async st=>{await showAll(st,'.io, .card',300);await type($('.ta',st),SKY_A,80);await type($('.tb',st),SKY_B,80);}},
 {t:'A person picks the better one',s:'Comparing two answers is faster and more consistent than writing a perfect one.',
  h:()=>`<div class="cards"><div class="card rv" id="ca"><span class="tag"><span>Answer A</span><span class="badge">Preferred</span></span><span class="a">New Delhi, plus a useful fact…</span></div><div class="card rv" id="cb"><span class="tag"><span>Answer B</span><span class="badge">Preferred</span></span><span class="a">Mumbai (wrong)…</span></div></div><div class="lrow rv">Label stored: ${chip('A ≻ B','tgt')} <span class="cap">repeated for ~100k prompt pairs</span></div>`,
  r:async st=>{await showAll(st,'.card',250);await wait(600);$('#ca',st).classList.add('pick');$('#cb',st).classList.add('lose');await wait(500);show(st,'.lrow');}},
 {t:'Train a reward model',s:'A copy of the model with a score head learns to predict which answer people would prefer.',
  h:()=>`<div class="flow rv"><span class="box">prompt + answer</span><span class="arr">→</span><span class="box rm">Reward model</span><span class="arr">→</span><span class="box mono">score</span></div>`+dvbars([['Answer A',1.8],['Answer B',-1.2]])+`<div class="rv"><span class="formula">loss = −log σ(r<sub>A</sub> − r<sub>B</sub>)</span></div><div class="cap rv">Pushes the preferred answer’s score above the rejected one.</div>`,
  r:async st=>{show(st,'.flow');await wait(500);await showAll(st,'.bar',450);await showAll(st,'.formula, .cap',400);
    $$('.formula',st).forEach(f=>f.parentElement.classList.add('show'));}},
 {t:'The model practises; the reward model grades',s:'On fresh prompts, the model being trained (the policy) samples answers and gets a score for each.',
  h:()=>`<div class="io rv"><span class="who">New prompt</span><div class="txt prompt">Which city is India\u2019s capital?</div></div><div class="cards">${[['New Delhi is India\u2019s capital.',2.3],['Delhi, I think.',0.2],['Mumbai is India\u2019s capital.',-2.0]].map(([a,v],i)=>`<div class="card rv"><span class="tag"><span>Sample ${i+1}</span><span class="sc" style="color:${v>1?'var(--green)':v<0?'var(--warn)':'var(--muted)'};opacity:0;transition:opacity var(--d)">reward ${v>0?'+':''}${v.toFixed(1)}</span></span><span class="a">${esc(a)}</span></div>`).join('')}</div>`,
  r:async st=>{await showAll(st,'.io, .card',380);await wait(300);for(const s of $$('.sc',st)){s.style.opacity=1;await wait(450);}}},
 {t:'PPO updates the policy',s:'Raise the probability of high-reward answers and lower the rest, while a KL penalty keeps the model close to the SFT version.',
  h:()=>`<div class="rv"><span class="formula">maximize  reward − β · KL(policy ‖ SFT model)</span></div><div class="bars" id="ppo">${[['Sample 1',.40,.62],['Sample 2',.35,.30],['Sample 3',.25,.08]].map(([l,a,b],i)=>`<div class="bar rv${i===0?' top':''}" data-b="${b}"><span class="l">${l}</span><div class="track"><div class="fill" style="--w:${a*100}%"></div></div><span class="v">${a.toFixed(2)}</span></div>`).join('')}</div><div class="kl rv"><span>KL leash</span><div class="track"><div class="fill" style="--w:24%"></div></div><span class="mono">small</span></div><div class="cap rv">Without the leash, the model learns to game the reward model (reward hacking).</div>`,
  r:async st=>{show(st,'.formula');$('.formula',st).parentElement.classList.add('show');await wait(500);await showAll(st,'#ppo .bar',200);await wait(700);
    for(const b of $$('#ppo .bar',st)){const v=+b.dataset.b;$('.fill',b).style.setProperty('--w',v*100+'%');$('.v',b).textContent=v.toFixed(2);await wait(350);}
    await wait(500);await showAll(st,'.kl, .cap',400);}},
 {t:'Result: an aligned assistant',s:'The model now leans toward answers people rate as helpful, honest and harmless.',
  h:()=>`<div class="io rv"><span class="who">Prompt</span><div class="txt prompt">${esc(KYC)}</div><span class="who">RLHF model</span><div class="txt resp"></div></div><div class="tags rv"><span>helpful</span><span>honest</span><span>harmless</span></div><div class="note rv">Variants: DPO trains directly on the preference pairs and skips the separate reward model; RLAIF uses AI feedback in place of some human labels.</div>`,
  r:async st=>{show(st,'.io');await wait(300);await type($('.resp',st),'The capital of India is New Delhi. It was inaugurated in 1931 and is home to Parliament and the Supreme Court.',70);await showAll(st,'.tags, .note',500);}},
 ]};

const STAGES={pretraining:PRE,sft:SFT,rlhf:RL};
let cur='pretraining';

function render(){
  const S=STAGES[cur];
  document.body.dataset.tab=cur;
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.k===cur)));
  $('#panel').innerHTML=S.steps.map((st,i)=>`<section class="step"><div class="num">${i+1}</div><div class="body"><h3>${st.t}</h3><p class="sub">${st.s}</p><div class="stage">${st.h()}</div></div></section>`).join('');
  $('#foot').innerHTML=`<div class="loopline rv">${S.loop}</div><button class="nextbtn rv" type="button" id="btn-next">${S.next[1]}</button><div class="credit rv">Created by <b>Ajeetkumar</b></div><div class="fine">Illustrative token IDs, probabilities, rewards and dataset sizes.</div>`;
  $('#btn-next').onclick=()=>go(S.next[0]);
}
async function run(){
  const id=++runId; render(); paused=false; $('#btn-pause').textContent='❚❚ Pause';
  const S=STAGES[cur], els=$$('.step'), stages=$$('.stage');
  try{
    await wait(300);
    for(let i=0;i<S.steps.length;i++){
      els[i].classList.add('on');
      if(i>0){const r=els[i].getBoundingClientRect();if(r.bottom>innerHeight||r.top<0)els[i].scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
      await S.steps[i].r(stages[i]);
      await wait(700);
      els[i].classList.remove('on');els[i].classList.add('done');
    }
    show(document,'#foot .rv');
    await wait(9000);
    if(id===runId) run();
  }catch(e){ if(!(e instanceof Abort)) console.error(e); }
}
function go(k){ if(!STAGES[k]) return; cur=k; try{history.replaceState(null,'','#'+k);}catch(e){} window.scrollTo({top:0}); run(); }

$$('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.k)));
$('#btn-restart').onclick=()=>{window.scrollTo({top:0});run();};
$('#btn-pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ Play':'❚❚ Pause';};
$$('.seg button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));

setSpeed(1);
const h=(location.hash||'').slice(1);
if(STAGES[h]) cur=h;
run();
</script>
<script src="../assets/data.js"></script>
<script src="../assets/lesson.js" data-lesson="genai/llm-training"></script>
