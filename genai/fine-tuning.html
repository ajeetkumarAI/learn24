<body>
<script>window.LESSON = {
 "eyebrow": "GenAI · Customisation",
 "title": "LoRA and Fine-Tuning",
 "color": "#5aa9ff",
 "lede": "When prompting and RAG aren’t enough, fine-tuning teaches a model a new behaviour. LoRA does it by training a tiny add-on instead of the whole model.",
 "steps": [
  {
   "t": "Pick the right tool first",
   "s": "Most problems are solved before fine-tuning.",
   "b": [
    {
     "type": "table",
     "head": [
      "Need",
      "Best tool",
      "Why"
     ],
     "rows": [
      [
       "Answer from your documents",
       "RAG",
       "facts change; just re-index"
      ],
      [
       "Follow a format or tone",
       "Prompting",
       "instructions + a few examples"
      ],
      [
       "Consistent style, domain jargon, structured output at scale",
       "Fine-tuning",
       "behaviour learned into weights"
      ],
      [
       "Smaller, cheaper model for one task",
       "Fine-tuning",
       "a small tuned model can match a big general one"
      ]
     ]
    }
   ]
  },
  {
   "t": "Prepare training examples",
   "s": "Hundreds to a few thousand high-quality input → ideal-output pairs.",
   "b": [
    {
     "type": "code",
     "cap": "train.jsonl",
     "text": "{\"messages\":[{\"role\":\"user\",\"content\":\"Classify: \\\"Card blocked after ATM failure in Pune\\\"\"},\n {\"role\":\"assistant\",\"content\":\"{\\\"category\\\":\\\"card_block\\\",\\\"priority\\\":\\\"high\\\"}\"}]}\n{\"messages\":[{\"role\":\"user\",\"content\":\"Classify: \\\"Need FD interest certificate\\\"\"},\n {\"role\":\"assistant\",\"content\":\"{\\\"category\\\":\\\"documents\\\",\\\"priority\\\":\\\"low\\\"}\"}]}"
    }
   ]
  },
  {
   "t": "Full fine-tuning: update every weight",
   "s": "Accurate, but you train and store a whole new copy of the model.",
   "b": [
    {
     "type": "bars",
     "rows": [
      [
       "Trainable params",
       7,
       "7 B",
       "badc"
      ],
      [
       "GPU memory",
       7,
       "~100+ GB",
       "badc"
      ],
      [
       "Saved checkpoint",
       7,
       "~14 GB",
       "badc"
      ]
     ],
     "max": 7
    }
   ]
  },
  {
   "t": "LoRA: freeze the model, train a small add-on",
   "s": "Keep the original weight matrix W frozen and learn two thin matrices B and A whose product is the update.",
   "b": [
    {
     "type": "code",
     "cap": "low-rank adaptation",
     "text": "W_new = W + B · A\n# W: 4096 × 4096 (frozen, 16.8 M values)\n# B: 4096 × 8,  A: 8 × 4096   (rank r = 8)\n# trainable: 65,536 values  →  0.4% of W"
    },
    {
     "type": "bars",
     "rows": [
      [
       "Full fine-tune",
       100,
       "100%"
      ],
      [
       "LoRA (r = 8)",
       0.6,
       "~0.5%",
       "top"
      ]
     ],
     "max": 100
    }
   ]
  },
  {
   "t": "Train and evaluate",
   "s": "Hold back a test set and compare against the base model on the same prompts.",
   "b": [
    {
     "type": "bars",
     "rows": [
      [
       "Base model",
       0.71,
       "71%"
      ],
      [
       "Base + few-shot prompt",
       0.83,
       "83%"
      ],
      [
       "LoRA fine-tuned",
       0.95,
       "95%",
       "top"
      ]
     ],
     "max": 1
    },
    {
     "type": "note",
     "text": "Ticket-classification accuracy on 500 held-out tickets (illustrative)."
    }
   ]
  },
  {
   "t": "Swap adapters per task",
   "s": "One base model in memory, many small LoRA adapters loaded on demand.",
   "b": [
    {
     "type": "flow",
     "nodes": [
      [
       "Base model",
       "loaded once"
      ],
      [
       "+ ticket-classifier",
       "30 MB"
      ],
      [
       "+ kyc-extractor",
       "30 MB"
      ],
      [
       "+ hindi-replies",
       "30 MB"
      ]
     ],
     "hot": [
      1,
      2,
      3
     ]
    }
   ]
  }
 ],
 "takeaways": [
  [
   "Try prompting and RAG first",
   "fine-tune for behaviour, not facts"
  ],
  [
   "Data quality beats data quantity",
   "500 clean examples > 50k noisy ones"
  ],
  [
   "LoRA trains well under 1% of the weights",
   "QLoRA adds 4-bit quantization to fit on one GPU"
  ],
  [
   "Always compare to the base model",
   "on a held-out test set"
  ]
 ],
 "fine": "Numbers are illustrative for a 7B-parameter model."
};</script>
