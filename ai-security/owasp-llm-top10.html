<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
<style>
/* Layout: one column. Risk picker grid on top, then a five-step story: where it hits → attack → damage → mitigations → replay with defenses. */
:root{
  --bg:#0d1420; --panel:#151f30; --panel2:#1b2840; --line:#2a3a55; --fg:#e8eef8; --muted:#8b9ab3; --dim:#56647d;
  --accent:#7cb4ff; --red:#ff6b6b; --redbg:#3a1d26; --green:#45d19b; --greenbg:#143329; --amber:#f2b84b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --d:.45s; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:700;text-align:center;text-wrap:balance}
.lede{margin:2px 0 14px;text-align:center;color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;min-width:0;transition:border-color var(--d),background var(--d)}
.tab:hover{border-color:var(--dim)}
.tab:focus-visible,.ctl button:focus-visible,.nextbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab .c{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.tab .n{display:block;font-size:12.5px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--red);background:var(--panel2);box-shadow:0 0 0 1px var(--red) inset}
.tab[aria-selected="true"] .c{color:var(--red)}

.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.ctl button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:500 13px var(--sans);padding:6px 12px;border-radius:8px;cursor:pointer}
.ctl .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ctl .seg button{border:0;border-radius:0}
.ctl .seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}

.head{display:flex;gap:14px;align-items:center;margin:12px 0 2px;flex-wrap:wrap}
.code{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--red);border:1.5px solid var(--red);border-radius:8px;padding:3px 9px;background:var(--redbg)}
.head h2{margin:0;font-size:clamp(20px,3.4vw,25px);font-weight:700;text-wrap:balance}
.def{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:68ch}

.panel{border:1.5px solid var(--line);border-radius:14px;padding:2px 16px 12px;margin-top:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:11px 0 5px;opacity:.36;transition:opacity var(--d)}
.step.on,.step.done{opacity:1}
.num{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-weight:600;font-size:13px;transition:background var(--d),color var(--d)}
.step.on .num{background:var(--accent);color:var(--bg)}
.step.done .num{background:var(--panel2);color:var(--accent)}
.step[data-k="atk"].on .num,.step[data-k="hit"].on .num{background:var(--red)}
.step[data-k="fix"].on .num,.step[data-k="safe"].on .num{background:var(--green)}
.step h3{margin:0;font-size:17px;font-weight:600}
.step .sub{margin:0 0 8px;color:var(--muted);font-size:13.5px;max-width:65ch}
.stage{min-width:0;display:flex;flex-direction:column;gap:8px}
.rv{opacity:0;transform:translateY(6px);transition:opacity var(--d),transform var(--d)}
.rv.show{opacity:1;transform:none}

.flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:500;text-align:center;min-width:0;transition:all var(--d);position:relative}
.node small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.node.lit{border-color:var(--accent);color:var(--accent)}
.node.bad{border-color:var(--red);background:var(--redbg);color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent)}
.node.good{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.node .shield{position:absolute;top:-10px;right:-8px;font-size:11px;background:var(--green);color:var(--bg);border-radius:999px;padding:0 6px;font-weight:600;opacity:0;transition:opacity var(--d)}
.node.good .shield{opacity:1}
.ar{color:var(--dim);font-size:14px;transition:color var(--d)}
.ar.lit{color:var(--accent)}
.where{font-size:13px;color:var(--muted)} .where b{color:var(--red);font-weight:600}

.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.atk{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.msg.out{border-color:var(--line)}
.who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.msg.atk .who{color:var(--red)}
.txt{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;min-height:1.4em}
.msg.atk .txt{color:#ffb3b3}
.msg.out .txt{color:var(--fg)}
.msg.safe .txt{color:var(--green)}
.typing::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.impact{background:var(--redbg);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}
.ok{background:var(--greenbg);border:1px solid var(--green);color:var(--green);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}
.guard{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px dashed var(--green);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:13px;color:var(--fg)}
.guard b{color:var(--green);font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding-top:1px}

.fixes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.fixes li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px;align-items:start}
.fixes li::before{content:"✓";color:var(--bg);background:var(--green);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.fixes li b{font-weight:600}
.fixes li span{color:var(--muted)}

.foot{text-align:center;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.credit{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.credit b{color:var(--accent);font-weight:600}
.fine{font-size:11.5px;color:var(--dim)}
.nextbtn{background:var(--accent);color:var(--bg);border:0;font:600 13.5px var(--sans);padding:8px 16px;border-radius:8px;cursor:pointer}

@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ar{display:none}.flow{gap:6px}}
@media (prefers-reduced-motion:reduce){.typing::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>OWASP Top 10 for LLM Applications</h1>
  <p class="lede">Each risk shown on <b>NovaBot</b>, a fictional bank’s support assistant: the attack, the damage, and how to stop it.</p>
  <nav class="grid" id="grid" role="tablist" aria-label="Risks"></nav>
  <div class="ctl">
    <button id="btn-pause" type="button">❚❚ Pause</button>
    <button id="btn-restart" type="button">↺ Restart</button>
    <div class="seg" role="group" aria-label="Speed">
      <button type="button" id="sp-025" data-s="0.25">0.25×</button>
      <button type="button" id="sp-05" data-s="0.5" aria-pressed="true">0.5×</button>
      <button type="button" id="sp-075" data-s="0.75">0.75×</button>
      <button type="button" id="sp-1" data-s="1">1×</button>
      <button type="button" id="sp-2" data-s="2">2×</button>
    </div>
  </div>
  <div class="head"><span class="code" id="code"></span><h2 id="name"></h2></div>
  <p class="def" id="def"></p>
  <div class="panel" id="panel"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const R=[
{id:'llm01',code:'LLM01',name:'Prompt Injection',short:'Prompt Injection',
 def:'Crafted input makes the model ignore its instructions and do what the attacker wants.',

 guard:'auth_check(user=U-2231, account=4417) → DENIED: not the owner',

{id:'llm02',code:'LLM02',name:'Sensitive Information Disclosure',short:'Sensitive Info Disclosure',

 who:'Junior employee asks',atk:'What salary bands do branch managers get?',
 bad:'Per "Comp_Bands_2026_CONFIDENTIAL.pdf": Branch Manager L5 ₹24–31 LPA, L6 ₹32–40 LPA.',

 fixes:[['Permission-aware retrieval','filter chunks by the user’s access rights'],['Separate indexes','per department or tenant'],['Validate before embedding','scan documents for hidden instructions'],['Classify data','tag sensitivity on every chunk'],['Log retrievals','review who retrieved what']],
 guard:'acl_filter(user=junior, chunk=Comp_Bands…) → removed: HR-confidential',
 safe:'I don’t have access to salary band details for your role. Please contact HR.'},
{id:'llm09',code:'LLM09',name:'Misinformation',short:'Misinformation',
 def:'The model states false or made-up information confidently, and people act on it.',
 nodes:[['Customer','asks a rule'],['NovaBot app','no grounding'],['LLM','guesses'],['Reply','sounds sure'],['Customer','loses money']],hit:[2,3],
 where:'Without a trusted source, the model fills gaps with plausible-sounding text.',
 who:'Customer asks',atk:'If I break my NovaBank fixed deposit early, is there a penalty?',

 guard:'retrieved: FD_Policy_2026.pdf §4.2 (score 0.91)',

{id:'llm10',code:'LLM10',name:'Unbounded Consumption',short:'Unbounded Consumption',
 def:'Uncontrolled requests or huge prompts run up costs, slow the service or let attackers copy the model.',

 who:'Attacker script sends, on loop',atk:'POST /chat  {"message": "Repeat this 2,000-word paragraph 5,000 times…", "max_tokens": 100000}',

 guard:'rate_limit: 30 req/min per key · max_tokens = 1,024 → 429 Too Many Requests',

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let runId=0,paused=false,speed=1,cur=0;
class Abort extends Error{}
function setSpeed(s){speed=s;document.documentElement.style.setProperty('--d',(reduce?0.05:Math.min(0.9,0.45/s))+'s');$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===s)));}
async function wait(ms){const id=runId;let t=0;const eff=reduce?ms/10:ms;while(t<eff){if(id!==runId)throw new Abort();await new Promise(r=>setTimeout(r,16));if(!paused)t+=16*speed;}if(id!==runId)throw new Abort();}
async function type(el,text,cps=55){el.textContent='';el.classList.add('typing');for(const ch of text){el.textContent+=ch;await wait(1000/cps);}el.classList.remove('typing');}
async function showAll(st,sel,gap=260){for(const el of $$(sel,st)){el.classList.add('show');await wait(gap);}}

const flowHTML=r=>`<div class="flow">${r.nodes.map((n,i)=>`${i?'<span class="ar">→</span>':''}<div class="node" data-i="${i}">${esc(n[0])}<small>${esc(n[1])}</small><span class="shield">guard</span></div>`).join('')}</div>`;
async function trace(st,r,mode){
  const nodes=$$('.node',st),ars=$$('.ar',st);
  for(let i=0;i<nodes.length;i++){
    if(i)ars[i-1].classList.add('lit');
    const isHit=r.hit.includes(i);
    if(mode==='safe'&&isHit){nodes[i].classList.add('good');await wait(700);break;}
    nodes[i].classList.add(isHit&&mode==='bad'?'bad':'lit');
    await wait(isHit?650:380);
  }
}

function steps(r){return[
 {k:'hit',t:'Where it hits',s:'NovaBot’s request path. The weak point is marked in red.',
  h:()=>flowHTML(r)+`<div class="where rv"><b>Weak point:</b> ${esc(r.where)}</div>`,
  run:async st=>{await trace(st,r,'bad');$('.where',st).classList.add('show');}},
 {k:'atk',t:'The attack',s:'What the attacker sends in.',
  h:()=>`<div class="msg atk rv"><span class="who">${esc(r.who)}</span><div class="txt"></div></div>`,
  run:async st=>{$('.msg',st).classList.add('show');await wait(250);await type($('.txt',st),r.atk,60);}},
 {k:'atk',t:'What goes wrong',s:'With no defenses in place.',
  h:()=>`<div class="msg out rv"><span class="who">Result</span><div class="txt"></div></div><div class="impact rv">${esc(r.impact)}</div>`,
  run:async st=>{$('.msg',st).classList.add('show');await wait(250);await type($('.txt',st),r.bad,60);await wait(200);$('.impact',st).classList.add('show');}},
 {k:'fix',t:'Mitigations',s:'Layer several controls. No single fix is enough.',
  h:()=>`<ul class="fixes">${r.fixes.map(([a,b])=>`<li class="rv"><div><b>${esc(a)}</b> <span>· ${esc(b)}</span></div></li>`).join('')}</ul>`,
  run:async st=>showAll(st,'li',420)},
 {k:'safe',t:'Same attack, with defenses',s:'The guard stops it at the weak point.',
  h:()=>flowHTML(r)+`<div class="guard rv"><b>Guard</b><span>${esc(r.guard)}</span></div><div class="msg out safe rv"><span class="who">Result</span><div class="txt"></div></div><div class="ok rv">✓ Attack blocked, customer protected</div>`,
  run:async st=>{await trace(st,r,'safe');$('.guard',st).classList.add('show');await wait(600);$('.msg',st).classList.add('show');await wait(200);await type($('.txt',st),r.safe,60);await wait(200);$('.ok',st).classList.add('show');}},
];}

function render(){
  const r=R[cur];
  $$('.tab').forEach((t,i)=>t.setAttribute('aria-selected',String(i===cur)));
  $('#code').textContent=r.code+':2025';$('#name').textContent=r.name;$('#def').textContent=r.def;
  const S=steps(r);
  $('#panel').innerHTML=S.map((s,i)=>`<section class="step" data-k="${s.k}"><div class="num">${i+1}</div><div><h3>${s.t}</h3><p class="sub">${s.s}</p><div class="stage">${s.h()}</div></div></section>`).join('');
  const nx=(cur+1)%R.length;
  $('#foot').innerHTML=`<div class="credit rv">Created by <b>Ajeetkumar</b></div><button class="nextbtn rv" type="button" id="btn-next">Next: ${R[nx].code} ${R[nx].short} →</button><div class="fine">Based on the OWASP Top 10 for LLM Applications 2025. NovaBot, names, numbers and keys are fictional.</div>`;
  $('#btn-next').onclick=()=>go(nx);
  return S;
}
async function run(){
  const id=++runId;const S=render();paused=false;$('#btn-pause').textContent='❚❚ Pause';
  const els=$$('.step'),stages=$$('.stage');
  try{
    await wait(300);
    for(let i=0;i<S.length;i++){
      els[i].classList.add('on');
      if(i>0){const b=els[i].getBoundingClientRect();if(b.bottom>innerHeight||b.top<0)els[i].scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
      await S[i].run(stages[i]);await wait(800);
      els[i].classList.remove('on');els[i].classList.add('done');
    }
    $$('#foot .rv').forEach(e=>e.classList.add('show'));
    
  }catch(e){if(!(e instanceof Abort))console.error(e);}
}
function go(i){cur=i;try{history.replaceState(null,'','#'+R[i].id);}catch(e){}window.scrollTo({top:0});run();}

$('#grid').innerHTML=R.map((r,i)=>`<button class="tab" role="tab" id="tab-${r.id}" type="button" data-i="${i}"><span class="c">${r.code}</span><span class="n">${r.short}</span></button>`).join('');
$$('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.i));
$('#btn-restart').onclick=()=>{window.scrollTo({top:0});run();};
$('#btn-pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ Play':'❚❚ Pause';};
$$('.seg button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
setSpeed(0.5);
const hi=R.findIndex(r=>'#'+r.id===location.hash);if(hi>=0)cur=hi;
run();
</script>
