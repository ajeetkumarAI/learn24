<body>
<script>window.LESSON = {
 "eyebrow": "GenAI · Retrieval",
 "title": "RAG From Scratch",
 "color": "#5aa9ff",
 "lede": "Retrieval-Augmented Generation lets a model answer from your documents instead of guessing. Here it is built for NovaBank’s policy PDFs.",
 "steps": [
  {
   "t": "The problem",
   "s": "The model was never trained on your private documents, so it fills the gap with a plausible guess.",
   "b": [
    {
     "type": "msg",
     "who": "Customer",
     "text": "What is the penalty for breaking a NovaBank FD early?"
    },
    {
     "type": "msg",
     "who": "LLM without RAG",
     "tone": "bad",
     "text": "There is no penalty for early withdrawal."
    }
   ]
  },
  {
   "t": "Chunk the documents",
   "s": "Split each document into small overlapping passages so each one holds a single idea.",
   "b": [
    {
     "type": "cards",
     "items": [
      [
       "FD_Policy.pdf · chunk 14",
       "Premature withdrawal attracts a penalty of 1% on the applicable rate."
      ],
      [
       "FD_Policy.pdf · chunk 15",
       "Tax-saver FDs cannot be withdrawn before 5 years."
      ],
      [
       "Savings_Rules.pdf · chunk 3",
       "Minimum balance for metro branches is ₹10,000."
      ]
     ]
    },
    {
     "type": "note",
     "text": "Typical size: <b>300–800 tokens</b> with 10–20% overlap."
    }
   ]
  },
  {
   "t": "Embed each chunk",
   "s": "An embedding model turns text into a vector: similar meaning gives nearby vectors.",
   "b": [
    {
     "type": "code",
     "cap": "embedding",
     "text": "embed(\"Premature withdrawal attracts a penalty…\")\n→ [0.021, -0.113, 0.087, … 1,536 numbers]"
    }
   ]
  },
  {
   "t": "Store in a vector database",
   "s": "Save each vector with its text and metadata (source, page, access level).",
   "b": [
    {
     "type": "flow",
     "nodes": [
      [
       "PDFs"
      ],
      [
       "Chunker"
      ],
      [
       "Embedding model"
      ],
      [
       "Vector DB",
       "pgvector · Qdrant · Pinecone"
      ]
     ],
     "hot": [
      3
     ]
    }
   ]
  },
  {
   "t": "Retrieve the closest chunks",
   "s": "Embed the question, then find the nearest chunk vectors (top-k, here k = 3).",
   "b": [
    {
     "type": "dots",
     "q": [
      62,
      64,
      "question"
     ],
     "pts": [
      [
       70,
       72,
       "FD penalty"
      ],
      [
       52,
       58,
       "tax-saver FD"
      ],
      [
       66,
       48,
       "FD interest rates"
      ],
      [
       18,
       30,
       "min balance"
      ],
      [
       28,
       80,
       "card limits"
      ],
      [
       86,
       20,
       "KYC rules"
      ]
     ],
     "near": [
      0,
      1,
      2
     ]
    }
   ]
  },
  {
   "t": "Augment the prompt",
   "s": "Put the retrieved chunks into the prompt and tell the model to answer only from them.",
   "b": [
    {
     "type": "code",
     "cap": "prompt sent to the LLM",
     "text": "Answer using only the context. Cite the source. If it is not there, say you don’t know.\n\nContext:\n[1] FD_Policy.pdf p.4: Premature withdrawal attracts a penalty of 1%…\n[2] FD_Policy.pdf p.4: Tax-saver FDs cannot be withdrawn before 5 years.\n\nQuestion: What is the penalty for breaking a NovaBank FD early?"
    }
   ]
  },
  {
   "t": "Grounded answer",
   "s": "Same question, now answered from the bank’s own policy, with a citation.",
   "b": [
    {
     "type": "msg",
     "who": "LLM with RAG",
     "tone": "good",
     "text": "Breaking an FD early reduces your interest rate by 1% [FD_Policy.pdf, p.4]. Tax-saver FDs can’t be broken before 5 years."
    }
   ]
  }
 ],
 "takeaways": [
  [
   "RAG = search + generate",
   "no retraining needed when documents change"
  ],
  [
   "Retrieval quality decides answer quality",
   "tune chunking, embeddings and top-k first"
  ],
  [
   "Always cite sources",
   "users and auditors can check the answer"
  ],
  [
   "Respect access rights",
   "filter chunks by who is asking (see OWASP LLM08)"
  ]
 ],
 "fine": "NovaBank and its policies are fictional."
};</script>
<script src="../assets/stepper.js"></script>
